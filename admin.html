<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Admin - Gestione Schede - Studio PT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .admin-panel {
            width: 100%;
            max-width: 650px;
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 25px 20px;
            box-sizing: border-box;
            box-shadow: 0 8px 30px rgba(0,0,0,0.7);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #d4af37;
            font-size: 1.2rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }
        .header-btn {
            background: transparent;
            color: #888;
            border: 1px solid #333;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            text-transform: uppercase;
            font-family: 'Montserrat', sans-serif;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 0.72rem;
            color: #aaa;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 1px;
            font-weight: 600;
        }
        input, select {
            width: 100%;
            background: #181818;
            border: 1px solid #333;
            color: #fff;
            padding: 10px 12px;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            box-sizing: border-box;
        }
        select { cursor: pointer; }
        input:focus, select:focus {
            border-color: #d4af37;
            outline: none;
        }
        .magic-link-box {
            background: #161616;
            border: 1px dashed #d4af37;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            display: none;
        }
        .magic-link-box p {
            margin: 0 0 8px 0;
            font-size: 0.75rem;
            color: #ccc;
        }
        .btn-copy-link {
            background: #d4af37;
            color: #000;
            border: none;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            font-family: 'Montserrat', sans-serif;
            width: 100%;
        }
        .btn-load {
            width: 100%;
            background: #1e1e1e;
            color: #d4af37;
            border: 1px solid #d4af37;
            padding: 11px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 5px;
            margin-bottom: 15px;
            font-family: 'Montserrat', sans-serif;
        }
        .badge-status {
            display: none;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.75rem;
            margin-bottom: 15px;
            text-align: center;
        }
        .badge-info { background: rgba(212, 175, 55, 0.15); color: #d4af37; border: 1px solid #d4af37; }
        .badge-success { background: rgba(46, 204, 113, 0.15); color: #2ecc71; border: 1px solid #2ecc71; }

        .days-tab-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-top: 20px;
            margin-bottom: 15px;
            border-bottom: 1px solid #222;
            align-items: center;
            scrollbar-width: none;
        }
        .days-tab-bar::-webkit-scrollbar { display: none; }
        .day-tab-btn {
            background: #161616;
            color: #888;
            border: 1px solid #333;
            padding: 8px 14px;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }
        .day-tab-btn.active {
            background: #d4af37;
            color: #000;
            border-color: #d4af37;
            font-weight: 700;
        }
        .btn-add-day {
            background: transparent;
            color: #d4af37;
            border: 1px dashed #d4af37;
            padding: 8px 14px;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }
        .day-title-editor {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
            background: #161616;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #262626;
        }
        .day-title-editor input {
            font-weight: 700;
            color: #d4af37;
        }
        .btn-delete-day {
            background: rgba(231, 76, 60, 0.15);
            border: 1px solid #e74c3c;
            color: #ff6b6b;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            font-family: 'Montserrat', sans-serif;
        }

        .ex-card {
            background: #0d0d0d;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 14px;
        }
        .ex-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .ex-index { color: #d4af37; font-size: 0.82rem; font-weight: 700; }
        .btn-remove-ex {
            background: transparent;
            border: none;
            color: #e74c3c;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 700;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }
        .preview-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #141414;
            border: 1px solid #222;
            border-radius: 6px;
            padding: 6px 10px;
            margin-bottom: 10px;
        }
        .preview-box img {
            width: 36px;
            height: 36px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #d4af37;
            background: #000;
        }
        .preview-path {
            font-size: 0.72rem;
            color: #888;
            word-break: break-all;
        }
        .btn-add-ex {
            width: 100%;
            background: #161616;
            color: #888;
            border: 1px dashed #444;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            margin-bottom: 20px;
            font-family: 'Montserrat', sans-serif;
            transition: all 0.2s;
        }
        .btn-add-ex:hover { color: #d4af37; border-color: #d4af37; }
        .btn-submit {
            width: 100%;
            background: #d4af37;
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 1px;
        }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="admin-panel">
        <div class="header">
            <h1>Studio PT - Pannello Schede</h1>
            <button class="header-btn" onclick="window.location.href='index.html'">Esci</button>
        </div>

        <div class="form-group">
            <label for="clienteNomeCognome">Nome e Cognome Cliente</label>
            <input type="text" id="clienteNomeCognome" placeholder="es. Enrico Lombardi" oninput="generaIdCliente()">
        </div>

        <div class="form-group">
            <label for="clientId">ID Link Personale</label>
            <input type="text" id="clientId" placeholder="es. enrico-lombardi" style="color: #d4af37; font-weight: 700;">
        </div>

        <div id="magicLinkBox" class="magic-link-box">
            <p>🔗 <b>Link Unico da Inviare al Cliente:</b><br><span id="txtMagicLink" style="color:#d4af37; font-size:0.75rem;"></span></p>
            <button type="button" class="btn-copy-link" onclick="copiaLinkCliente()">📲 Copia Link WhatsApp</button>
        </div>

        <button type="button" class="btn-load" onclick="caricaSchedaEsistente()">🔍 Carica Scheda Già Esistente</button>
        <div id="statusBadge" class="badge-status badge-info"></div>

        <div class="days-tab-bar">
            <div id="tabsContainer" style="display:flex; gap:8px;"></div>
            <button type="button" class="btn-add-day" onclick="aggiungiNuovoGiorno()">+ Aggiungi Giorno</button>
        </div>

        <div class="day-title-editor">
            <input type="text" id="activeDayTitle" placeholder="Nome Giorno (es. Giorno A)" oninput="aggiornaTitoloGiornoCorrente(this.value)">
            <button type="button" class="btn-delete-day" onclick="eliminaGiornoCorrente()">Elimina Giorno</button>
        </div>

        <div id="listaEserciziEditor"></div>

        <button type="button" class="btn-add-ex" onclick="aggiungiNuovoEsercizioCard()">+ Aggiungi Esercizio a Questo Giorno</button>

        <button type="button" id="btnSalvaScheda" class="btn-submit" onclick="salvaTuttoIlProgramma()">💾 Salva Tutto il Programma (1 Solo Clic)</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://xhgxosffgsuokrsycvyd.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhoZ3hvc2ZmZ3N1b2tyc3ljdnlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMTgyNzgsImV4cCI6MjEwMzY5NDI3OH0.OGkhaS3O-aWXV65tV3uwMpo9VmCmr3Hgubfn2ShuVMg';
        const db = window.supabase.createClient(supabaseUrl, supabaseKey);

        let archivioGifEsercizi = [];

        let programmaSettimanale = [
            { titolo: "Giorno A", esercizi: [] },
            { titolo: "Giorno B", esercizi: [] }
        ];
        let indiceGiornoAttivo = 0;

        function mostraAvviso(testo, tipo = 'badge-info') {
            const badge = document.getElementById('statusBadge');
            badge.className = `badge-status ${tipo}`;
            badge.innerText = testo;
            badge.style.display = 'block';
        }

        function generaIdCliente() {
            const nomeCompleto = document.getElementById('clienteNomeCognome').value.trim();
            const cleanSlug = nomeCompleto
                .toLowerCase()
                .replace(/[^\w\s-]/g, '')
                .replace(/\s+/g, '-');
            
            document.getElementById('clientId').value = cleanSlug;
            aggiornaBoxMagicLink(cleanSlug);
        }

        function aggiornaBoxMagicLink(slug) {
            const box = document.getElementById('magicLinkBox');
            const txt = document.getElementById('txtMagicLink');
            if (!slug) {
                box.style.display = 'none';
                return;
            }
            const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
            const fullUrl = `${baseUrl}/dashboard.html?id=${slug}`;
            txt.innerText = fullUrl;
            box.style.display = 'block';
        }

        function copiaLinkCliente() {
            const txt = document.getElementById('txtMagicLink').innerText;
            navigator.clipboard.writeText(txt).then(() => {
                alert("✅ Link copiato negli appunti! Incollalo su WhatsApp al cliente.");
            });
        }

        function renderTabsGiorni() {
            const container = document.getElementById('tabsContainer');
            container.innerHTML = "";

            programmaSettimanale.forEach((giorno, idx) => {
                const btn = document.createElement('button');
                btn.type = "button";
                btn.className = `day-tab-btn ${idx === indiceGiornoAttivo ? 'active' : ''}`;
                btn.innerText = giorno.titolo || `Giorno ${idx + 1}`;
                btn.onclick = () => cambiaGiorno(idx);
                container.appendChild(btn);
            });

            document.getElementById('activeDayTitle').value = programmaSettimanale[indiceGiornoAttivo].titolo;
            renderEserciziGiornoAttivo();
        }

        function cambiaGiorno(nuovoIndice) {
            salvaDatiFormNelGiornoAttivo();
            indiceGiornoAttivo = nuovoIndice;
            renderTabsGiorni();
        }

        function aggiungiNuovoGiorno() {
            salvaDatiFormNelGiornoAttivo();
            const lettere = ["A", "B", "C", "D", "E", "F"];
            const nextLettera = lettere[programmaSettimanale.length] || (programmaSettimanale.length + 1);
            programmaSettimanale.push({ titolo: `Giorno ${nextLettera}`, esercizi: [] });
            indiceGiornoAttivo = programmaSettimanale.length - 1;
            renderTabsGiorni();
        }

        function eliminaGiornoCorrente() {
            if (programmaSettimanale.length <= 1) {
                alert("Devi mantenere almeno un giorno nella scheda.");
                return;
            }
            if (confirm(`Vuoi davvero eliminare "${programmaSettimanale[indiceGiornoAttivo].titolo}"?`)) {
                programmaSettimanale.splice(indiceGiornoAttivo, 1);
                indiceGiornoAttivo = Math.max(0, indiceGiornoAttivo - 1);
                renderTabsGiorni();
            }
        }

        function aggiornaTitoloGiornoCorrente(nuovoTitolo) {
            programmaSettimanale[indiceGiornoAttivo].titolo = nuovoTitolo;
            const activeBtn = document.querySelectorAll('.day-tab-btn')[indiceGiornoAttivo];
            if (activeBtn) activeBtn.innerText = nuovoTitolo;
        }

        function salvaDatiFormNelGiornoAttivo() {
            const cards = document.querySelectorAll('.ex-card');
            let eserciziArray = [];

            cards.forEach(card => {
                const selectEl = card.querySelector('.select-esercizio');
                const nome = selectEl.value.trim();
                const target = card.querySelector('.input-target').value.trim() || "3x10";
                const recupero = parseInt(card.querySelector('.input-recupero').value) || 90;
                const gif = card.querySelector('.input-gif-hidden').value.trim();
                const video = card.querySelector('.input-video').value.trim();
                const ultimo_peso = card.dataset.ultimoPeso || "";
                const storico = card.dataset.storico ? JSON.parse(card.dataset.storico) : [];

                if (nome !== "") {
                    eserciziArray.push({ nome, target, recupero, gif, video, ultimo_peso, storico });
                }
            });

            programmaSettimanale[indiceGiornoAttivo].esercizi = eserciziArray;
        }

        function renderEserciziGiornoAttivo() {
            const container = document.getElementById('listaEserciziEditor');
            container.innerHTML = "";
            const giorno = programmaSettimanale[indiceGiornoAttivo];

            if (!giorno.esercizi || giorno.esercizi.length === 0) {
                creaCardEsercizio();
            } else {
                giorno.esercizi.forEach((ex, idx) => {
                    creaCardEsercizio(ex, idx);
                });
            }
        }

        function creaCardEsercizio(dati = {}, index = null) {
            const container = document.getElementById('listaEserciziEditor');
            const currentIndex = (index !== null) ? index : container.children.length;

            const card = document.createElement('div');
            card.className = "ex-card";
            card.dataset.ultimoPeso = dati.ultimo_peso || "";
            card.dataset.storico = JSON.stringify(dati.storico || []);

            card.innerHTML = `
                <div class="ex-card-header">
                    <span class="ex-index">Esercizio #${currentIndex + 1}</span>
                    <button type="button" class="btn-remove-ex" onclick="this.closest('.ex-card').remove(); rinumeraEsercizi();">✕ Rimuovi</button>
                </div>

                <div class="form-group">
                    <label>Seleziona Esercizio dalla Cartella</label>
                    <select class="select-esercizio" data-selected="${dati.nome || ''}" onchange="gestisciCambioEsercizio(this)">
                    </select>
                </div>

                <div class="grid-2">
                    <div>
                        <label>Target (es. 2 set per 3, 4x10)</label>
                        <input type="text" class="input-target" value="${dati.target || '3x10'}">
                    </div>
                    <div>
                        <label>Recupero (secondi)</label>
                        <input type="number" class="input-recupero" value="${dati.recupero || 90}">
                    </div>
                </div>

                <div class="preview-box">
                    <img class="img-preview" src="${dati.gif || 'data:image/svg+xml,<svg xmlns=\'http://www.w3.org/2000/svg\'/>'}" alt="Preview">
                    <div>
                        <div style="font-size: 0.68rem; color: #aaa; text-transform: uppercase;">File collegato:</div>
                        <span class="preview-path">${dati.gif || 'Nessuna GIF selezionata'}</span>
                    </div>
                </div>
                <input type="hidden" class="input-gif-hidden" value="${dati.gif || ''}">

                <div class="form-group" style="margin-bottom: 0;">
                    <label>Link Video (Opzionale)</label>
                    <input type="text" class="input-video" placeholder="https://youtube.com/..." value="${dati.video || ''}">
                </div>
            `;

            container.appendChild(card);
            const selectCreato = card.querySelector('.select-esercizio');
            costruisciOpzioniSelect(selectCreato, dati.nome || "");
        }

        function gestisciCambioEsercizio(selectEl) {
            const card = selectEl.closest('.ex-card');
            const selectedOpt = selectEl.options[selectEl.selectedIndex];
            const percorso = selectedOpt.dataset.path || "";

            const previewImg = card.querySelector('.img-preview');
            const previewPathText = card.querySelector('.preview-path');
            const hiddenGifInput = card.querySelector('.input-gif-hidden');

            if (percorso) {
                hiddenGifInput.value = percorso;
                previewPathText.innerText = percorso;
                previewImg.src = percorso;
            } else {
                hiddenGifInput.value = "";
                previewPathText.innerText = "Nessuna GIF selezionata";
                previewImg.src = "";
            }
        }

        function aggiungiNuovoEsercizioCard() {
            creaCardEsercizio();
        }

        function rinumeraEsercizi() {
            document.querySelectorAll('.ex-card').forEach((card, idx) => {
                card.querySelector('.ex-index').innerText = `Esercizio #${idx + 1}`;
            });
        }

        function costruisciOpzioniSelect(selectElement, selezionato = "") {
            selectElement.innerHTML = `<option value="">-- Seleziona Esercizio dalla cartella --</option>`;
            const listaOrdinata = [...archivioGifEsercizi].sort((a, b) => a.nome.localeCompare(b.nome));

            let trovato = false;
            listaOrdinata.forEach(ex => {
                const opt = document.createElement('option');
                opt.value = ex.nome;
                opt.dataset.path = ex.percorso;
                opt.innerText = ex.nome;
                if (ex.nome === selezionato || ex.percorso === selezionato) {
                    opt.selected = true;
                    trovato = true;
                }
                selectElement.appendChild(opt);
            });

            if (selezionato && !trovato) {
                const optCustom = document.createElement('option');
                optCustom.value = selezionato;
                optCustom.innerText = selezionato;
                optCustom.selected = true;
                selectElement.appendChild(optCustom);
            }
        }

        async function popolaArchivioGifDaGitHub() {
            try {
                let owner = "luigirosati";
                let repo = "studio-pt";

                if (window.location.hostname.includes("github.io")) {
                    owner = window.location.hostname.split('.')[0];
                    repo = window.location.pathname.split('/')[1] || repo;
                }

                const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/esercizi`);
                if (!res.ok) throw new Error("GitHub non raggiungibile");
                
                const items = await res.json();
                archivioGifEsercizi = [];

                for (const item of items) {
                    if (item.type === "file" && item.name.match(/\.(gif|mp4|webp|png|jpg)$/i)) {
                        archivioGifEsercizi.push({
                            nome: item.name.replace(/\.[^/.]+$/, ""),
                            percorso: item.path
                        });
                    } else if (item.type === "dir") {
                        const subRes = await fetch(item.url);
                        if (subRes.ok) {
                            const subItems = await subRes.json();
                            subItems.forEach(sub => {
                                if (sub.name.match(/\.(gif|mp4|webp|png|jpg)$/i)) {
                                    archivioGifEsercizi.push({
                                        nome: sub.name.replace(/\.[^/.]+$/, ""),
                                        percorso: sub.path
                                    });
                                }
                            });
                        }
                    }
                }
                renderTabsGiorni();
            } catch (e) {
                renderTabsGiorni();
            }
        }

        async function caricaSchedaEsistente() {
            const clientId = document.getElementById('clientId').value.trim();
            if (!clientId) {
                alert("Inserisci Nome e Cognome del cliente per caricare.");
                return;
            }

            mostraAvviso("Ricerca programma in corso...");

            try {
                const { data, error } = await db
                    .from('schede_clienti')
                    .select('*')
                    .eq('client_id', clientId);

                if (error) throw error;
                if (!data || data.length === 0) {
                    mostraAvviso("Nessuna scheda trovata per questo cliente. Creane una nuova.");
                    return;
                }

                if (data.length === 1 && data[0].titolo_sessione === "PROGRAMMA_COMPLETO") {
                    programmaSettimanale = JSON.parse(data[0].dati_scheda);
                } else {
                    programmaSettimanale = data.map(riga => ({
                        titolo: riga.titolo_sessione || "Giorno A",
                        esercizi: JSON.parse(riga.dati_scheda || "[]")
                    }));
                }

                indiceGiornoAttivo = 0;
                renderTabsGiorni();
                aggiornaBoxMagicLink(clientId);
                mostraAvviso(`✅ Scheda di "${clientId}" caricata con successo!`, 'badge-success');

            } catch (err) {
                alert("Errore: " + err.message);
            }
        }

        async function salvaTuttoIlProgramma() {
            salvaDatiFormNelGiornoAttivo();

            const clientId = document.getElementById('clientId').value.trim();
            const btn = document.getElementById('btnSalvaScheda');

            if (!clientId) {
                alert("Inserisci il Nome e Cognome del cliente prima di salvare!");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Salvataggio in corso...";

            try {
                await db.from('schede_clienti').delete().eq('client_id', clientId);

                const { error } = await db.from('schede_clienti').insert([{
                    client_id: clientId,
                    email_cliente: clientId,
                    titolo_sessione: "PROGRAMMA_COMPLETO",
                    dati_scheda: JSON.stringify(programmaSettimanale)
                }]);

                if (error) throw error;
