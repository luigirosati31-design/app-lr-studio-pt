<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Admin - LR Studio PT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #000000; 
            color: #ffffff; 
            font-family: 'Montserrat', sans-serif; 
            margin: 0;
            padding: 20px 20px 40px 20px; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            width: 100%;
            max-width: 450px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #333333;
        }
        .header h1 {
            color: #d4af37;
            font-size: 1.2rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }
        .logout-btn {
            background-color: transparent;
            color: #888888;
            border: 1px solid #333333;
            padding: 8px 12px;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            cursor: pointer;
            text-transform: uppercase;
        }
        .card-container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .card {
            background-color: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }
        .card h3 {
            color: #d4af37;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.1rem;
            border-bottom: 1px solid #222;
            padding-bottom: 10px;
        }
        label {
            display: block;
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 5px;
            margin-top: 12px;
        }
        input, select {
            width: 100%;
            background: #0a0a0a;
            border: 1px solid #333;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            box-sizing: border-box;
        }
        input:focus, select:focus { border-color: #d4af37; outline: none; }
        .exercise-row {
            background: #161616;
            border: 1px solid #222;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
        }
        .exercise-row input { margin-bottom: 8px; }
        .admin-btn {
            width: 100%;
            padding: 12px;
            background-color: #d4af37;
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
            text-transform: uppercase;
        }
        .admin-btn:hover { background-color: #b5952f; }
        .btn-secondary {
            background-color: transparent;
            color: #d4af37;
            border: 1px dashed #d4af37;
            margin-top: 10px;
        }
        .remove-row {
            background: transparent;
            color: #e74c3c;
            border: none;
            font-size: 0.75rem;
            cursor: pointer;
            text-transform: uppercase;
            float: right;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Area Admin</h1>
        <button class="logout-btn" onclick="faiLogout()">Esci</button>
    </div>

    <div class="card-container">
        
        <div class="card">
            <h3>1. Seleziona Destinatario</h3>
            <label>Email del Cliente</label>
            <input type="email" id="clienteEmail" placeholder="es. cliente@email.com">
        </div>

        <div class="card">
            <h3>2. Aggiorna Misurazioni Fisiche</h3>
            <div class="grid-2">
                <div><label>Peso (kg)</label><input type="text" id="mPeso" placeholder="es. 78.5"></div>
                <div><label>Petto (cm)</label><input type="text" id="mPetto" placeholder="es. 105"></div>
            </div>
            <div class="grid-2">
                <div><label>Spalle (cm)</label><input type="text" id="mSpalle" placeholder="es. 122"></div>
                <div><label>Braccio (cm)</label><input type="text" id="mBraccio" placeholder="es. 38.5"></div>
            </div>
            <div class="grid-2">
                <div><label>Vita (cm)</label><input type="text" id="mVita" placeholder="es. 80"></div>
                <div><label>Fianchi (cm)</label><input type="text" id="mFianchi" placeholder="es. 95"></div>
            </div>
            <div class="grid-2">
                <div><label>Quadricipiti (cm)</label><input type="text" id="mQuadricipiti" placeholder="es. 60"></div>
                <div><label>Polpacci (cm)</label><input type="text" id="mPolpacci" placeholder="es. 38"></div>
            </div>
            <button class="admin-btn btn-secondary" onclick="aggiornaMisure()">Aggiorna Misure</button>
        </div>

        <div class="card">
            <h3>3. Crea Scheda di Allenamento</h3>
            <label>Titolo Sessione / Gruppo Muscolare</label>
            <input type="text" id="giornoSessione" placeholder="es. Giorno A - Petto e Tricipiti">

            <div id="containerEsercizi">
                <div class="exercise-row">
                    <button type="button" class="remove-row" onclick="this.parentElement.remove()">Elimina</button>
                    <label>Nome Esercizio</label>
                    <input type="text" class="input-nome" placeholder="es. Panca Piana Manubri">
                    <label>Target (Serie x Rip)</label>
                    <input type="text" class="input-target" placeholder="es. 4 x 10">
                    <label>Recupero (in secondi)</label>
                    <input type="number" class="input-rec" value="90">
                    <label>Link URL GIF (Opzionale)</label>
                    <input type="text" class="input-gif" placeholder="Lascia vuoto per icona standard">
                </div>
            </div>

            <button class="admin-btn btn-secondary" onclick="aggiungiRigaEsercizio()">+ Aggiungi Esercizio</button>
            <button class="admin-btn" onclick="pubblicaScheda()">Pubblica Scheda su Supabase</button>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'httpsxhgxosffgsuokrsycvyd.supabase.co'.replace('https', 'https://'); // fallback sicuro
        const fixedUrl = 'https://xhgxosffgsuokrsycvyd.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhoZ3hvc2ZmZ3N1b2tyc3ljdnlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMTgyNzgsImV4cCI6MjEwMzY5NDI3OH0.OGkhaS3O-aWXV65tV3uwMpo9VmCmr3Hgubfn2ShuVMg';
        const db = window.supabase.createClient(fixedUrl, supabaseKey);

        function faiLogout() { window.location.href = "index.html"; }

        function aggiungiRigaEsercizio() {
            const container = document.getElementById('containerEsercizi');
            const nuovaRiga = document.createElement('div');
            nuovaRiga.className = 'exercise-row';
            nuovaRiga.innerHTML = `
                <button type="button" class="remove-row" onclick="this.parentElement.remove()">Elimina</button>
                <label>Nome Esercizio</label>
                <input type="text" class="input-nome" placeholder="es. Rematore Manubrio">
                <label>Target (Serie x Rip)</label>
                <input type="text" class="input-target" placeholder="es. 4 x 12">
                <label>Recupero (in secondi)</label>
                <input type="number" class="input-rec" value="60">
                <label>Link URL GIF (Opzionale)</label>
                <input type="text" class="input-gif" placeholder="Lascia vuoto per icona standard">
            `;
            container.appendChild(nuovaRiga);
        }

        async function aggiornaMisure() {
            const emailCliente = document.getElementById('clienteEmail').value.trim();
            const peso = document.getElementById('mPeso').value;
            const petto = document.getElementById('mPetto').value;
            const spalle = document.getElementById('mSpalle').value;
            const braccio = document.getElementById('mBraccio').value;
            const vita = document.getElementById('mVita').value;
            const fianchi = document.getElementById('mFianchi').value;
            const quadricipiti = document.getElementById('mQuadricipiti').value;
            const polpacci = document.getElementById('mPolpacci').value;

            if(!emailCliente) { alert("Inserisci prima l'email del cliente in alto!"); return; }

            const { error } = await db.from('misure_clienti').insert([{ email_cliente: emailCliente, peso, petto, spalle, braccio, vita, fianchi, quadricipiti, polpacci }]);
            if (error) { alert("Errore nel salvataggio: " + error.message); } 
            else { alert("Misurazioni aggiornate con successo per " + emailCliente + "!"); }
        }

        async function pubblicaScheda() {
            const emailCliente = document.getElementById('clienteEmail').value.trim();
            const titolo = document.getElementById('giornoSessione').value;
            const righe = document.querySelectorAll('.exercise-row');
            
            if(!emailCliente || !titolo) { alert("Inserisci l'email del cliente e il titolo della sessione!"); return; }

            let listaEsercizi = [];
            righe.forEach(riga => {
                const nome = riga.querySelector('.input-nome').value.trim();
                const target = riga.querySelector('.input-target').value.trim();
                const recupero = riga.querySelector('.input-rec').value;
                const gif = riga.querySelector('.input-gif').value.trim();
                
                if(nome && target) {
                    listaEsercizi.push({ nome, target, recupero, gif });
                }
            });

            if(listaEsercizi.length === 0) { alert("Aggiungi almeno un esercizio."); return; }

            const { error } = await db.from('schede_clienti').insert([{ email_cliente: emailCliente, titolo_sessione: titolo, dati_scheda: JSON.stringify(listaEsercizi) }]);
            if (error) { alert("Errore durante il salvataggio: " + error.message); } 
            else { alert(`Scheda "${titolo}" pubblicata con successo per ${emailCliente}!`); }
        }
    </script>
</body>
</html>
