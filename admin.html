<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Admin Panel - LR Studio PT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 20px 20px 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #333333;
        }
        .header h1 {
            color: #d4af37;
            font-size: 1.2rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }
        .logout-btn {
            background-color: transparent;
            color: #888888;
            border: 1px solid #333333;
            padding: 8px 12px;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            cursor: pointer;
            text-transform: uppercase;
        }
        .admin-card {
            width: 100%;
            max-width: 500px;
            background-color: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        .admin-card h2 {
            color: #d4af37;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        label {
            display: block;
            font-size: 0.75rem;
            color: #888888;
            text-transform: uppercase;
            margin-bottom: 6px;
            margin-top: 12px;
        }
        input, select, textarea {
            width: 100%;
            background-color: #161616;
            border: 1px solid #333333;
            color: #ffffff;
            padding: 10px;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            box-sizing: border-box;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #d4af37;
            outline: none;
        }
        select option, select optgroup {
            background: #111;
            color: #fff;
        }
        select optgroup {
            color: #d4af37;
            font-weight: 700;
        }
        .exercise-form-block {
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            position: relative;
        }
        .exercise-form-block .remove-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: transparent;
            color: #e74c3c;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 700;
        }
        .action-btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            text-transform: uppercase;
        }
        .btn-gold { background-color: #d4af37; color: #000; border: none; }
        .btn-outline { background-color: transparent; color: #d4af37; border: 1px dashed #d4af37; }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .grid-4 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Admin LR Studio</h1>
        <button class="logout-btn" onclick="faiLogout()">Esci</button>
    </div>

    <!-- SEZIONE 1: SCHEDA ALLENAMENTO -->
    <div class="admin-card">
        <h2>🏋️ Assegna Scheda Allenamento</h2>
        
        <label>Email Cliente</label>
        <input type="email" id="emailClienteScheda" placeholder="es. cliente@email.com">

        <label>Titolo Sessione (es. Giorno A - Petto e Bicipiti)</label>
        <input type="text" id="titoloSessione" placeholder="es. Giorno A - Petto e Bicipiti">

        <div id="eserciziContainer"></div>

        <button class="action-btn btn-outline" onclick="aggiungiBloccoEsercizio()">+ Aggiungi Esercizio</button>
        <button class="action-btn btn-gold" onclick="salvaSchedaCliente()">💾 Salva e Assegna Scheda</button>
    </div>

    <!-- SEZIONE 2: PACCHETTO MASSAGGI -->
    <div class="admin-card">
        <h2>💆‍♂️ Pacchetto Massaggi</h2>
        
        <label>Email Cliente</label>
        <input type="email" id="emailClienteMassaggi" placeholder="es. cliente@email.com">

        <label>Nome Pacchetto</label>
        <input type="text" id="nomePacchetto" placeholder="es. Pacchetto Scarico / Decontratturante">

        <label>Sedute Rimanenti</label>
        <input type="number" id="seduteRimaste" placeholder="es. 3">

        <button class="action-btn btn-gold" onclick="salvaPacchettoMassaggi()">💾 Aggiorna Pacchetto</button>
    </div>

    <!-- SEZIONE 3: MISURE ANTROPOMETRICHE -->
    <div class="admin-card">
        <h2>📏 Inserisci Misure Antropometriche</h2>
        
        <label>Email Cliente</label>
        <input type="email" id="emailClienteMisure" placeholder="es. cliente@email.com">

        <div class="grid-4">
            <div><label>Peso (kg)</label><input type="text" id="mPeso" placeholder="80"></div>
            <div><label>Petto (cm)</label><input type="text" id="mPetto" placeholder="105"></div>
            <div><label>Spalle (cm)</label><input type="text" id="mSpalle" placeholder="122"></div>
            <div><label>Braccio (cm)</label><input type="text" id="mBraccio" placeholder="38.5"></div>
            <div><label>Vita (cm)</label><input type="text" id="mVita" placeholder="80"></div>
            <div><label>Fianchi (cm)</label><input type="text" id="mFianchi" placeholder="95"></div>
            <div><label>Quadricipiti (cm)</label><input type="text" id="mQuadricipiti" placeholder="60"></div>
            <div><label>Polpacci (cm)</label><input type="text" id="mPolpacci" placeholder="38"></div>
        </div>

        <button class="action-btn btn-gold" onclick="salvaMisureAdmin()">💾 Salva Misurazioni</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://xhgxosffgsuokrsycvyd.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhoZ3hvc2ZmZ3N1b2tyc3ljdnlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMTgyNzgsImV4cCI6MjEwMzY5NDI3OH0.OGkhaS3O-aWXV65tV3uwMpo9VmCmr3Hgubfn2ShuVMg';
        const db = window.supabase.createClient(supabaseUrl, supabaseKey);

        const GITHUB_USER = "luigirosati31-design";
        const GITHUB_REPO = "app-lr-studio-pt";

        let opzioniGifPrecaricateHtml = `<option value="">-- Nessuna GIF (Mostra Logo LR) --</option>`;

        async function faiLogout() {
            await db.auth.signOut();
            window.location.href = "index.html";
        }

        async function caricaGifDaGitHub() {
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/esercizi`);
                if (!response.ok) return;

                const files = await response.json();
                const gifFiles = files.filter(f => f.name.match(/\.(gif|webp|png|jpg|jpeg)$/i));

                let gruppi = {};

                gifFiles.forEach(file => {
                    let nomeCompleto = file.name.replace(/\.[^/.]+$/, "");
                    let parti = nomeCompleto.split('_');
                    
                    let gruppo = "Altri Esercizi";
                    let nomeEsercizio = nomeCompleto.replace(/_/g, " ");

                    if (parti.length > 1) {
                        gruppo = parti[0].charAt(0).toUpperCase() + parti[0].slice(1).toLowerCase();
                        nomeEsercizio = parti.slice(1).join(" ").toUpperCase();
                    }

                    if (!gruppi[gruppo]) gruppi[gruppo] = [];
                    gruppi[gruppo].push({
                        nome: nomeEsercizio,
                        percorso: `esercizi/${file.name}`
                    });
                });

                let html = `<option value="">-- Nessuna GIF (Mostra Logo LR) --</option>`;
                for (const [gruppo, lista] of Object.entries(gruppi)) {
                    html += `<optgroup label="${gruppo}">`;
                    lista.forEach(item => {
                        html += `<option value="${item.percorso}">${item.nome}</option>`;
                    });
                    html += `</optgroup>`;
                }

                opzioniGifPrecaricateHtml = html;

                document.querySelectorAll('.ex-gif').forEach(sel => {
                    let val = sel.value;
                    sel.innerHTML = opzioniGifPrecaricateHtml;
                    sel.value = val;
                });

            } catch (err) {
                console.log("GitHub API non raggiungibile al momento:", err);
            }
        }

        function aggiungiBloccoEsercizio() {
            const container = document.getElementById('eserciziContainer');
            const div = document.createElement('div');
            div.className = 'exercise-form-block';
            
            div.innerHTML = `
                <button type="button" class="remove-btn" onclick="this.parentElement.remove()">✕ Rimuovi</button>
                <label>Nome Esercizio</label>
                <input type="text" class="ex-nome" placeholder="es. Panca Piana Manubri">

                <label>Seleziona GIF / Animazione</label>
                <select class="ex-gif">
                    ${opzioniGifPrecaricateHtml}
                </select>

                <div class="grid-2">
                    <div>
                        <label>Target (es. 4x10)</label>
                        <input type="text" class="ex-target" placeholder="es. 4x10">
                    </div>
                    <div>
                        <label>Recupero (secondi)</label>
                        <input type="number" class="ex-recupero" placeholder="es. 90" value="90">
                    </div>
                </div>
            `;
            container.appendChild(div);
        }

        async function salvaSchedaCliente() {
            const email = document.getElementById('emailClienteScheda').value.trim();
            const titolo = document.getElementById('titoloSessione').value.trim();
            const blocchi = document.querySelectorAll('.exercise-form-block');

            if (!email || !titolo) {
                alert("Inserisci l'email del cliente e il titolo della sessione.");
                return;
            }

            if (blocchi.length === 0) {
                alert("Aggiungi almeno un esercizio alla scheda.");
                return;
            }

            const listaEsercizi = [];
            blocchi.forEach(b => {
                const nome = b.querySelector('.ex-nome').value.trim();
                const gif = b.querySelector('.ex-gif').value.trim();
                const target = b.querySelector('.ex-target').value.trim() || '3x10';
                const recupero = parseInt(b.querySelector('.ex-recupero').value) || 90;

                if (nome) {
                    listaEsercizi.push({ nome, gif, target, recupero });
                }
            });

            const { error } = await db.from('schede_clienti').insert([{
                email_cliente: email,
                titolo_sessione: titolo,
                dati_scheda: JSON.stringify(listaEsercizi)
            }]);

            if (error) {
                alert("Errore salvataggio scheda: " + error.message);
            } else {
                alert(`Scheda "${titolo}" pubblicata con successo per ${email}!`);
                document.getElementById('eserciziContainer').innerHTML = '';
                document.getElementById('titoloSessione').value = '';
                aggiungiBloccoEsercizio();
            }
        }

        async function salvaPacchettoMassaggi() {
            const email = document.getElementById('emailClienteMassaggi').value.trim();
            const nome = document.getElementById('nomePacchetto').value.trim();
            const sedute = parseInt(document.getElementById('seduteRimaste').value);

            if (!email || isNaN(sedute)) {
                alert("Inserisci l'email e il numero di sedute.");
                return;
            }

            const { error } = await db.from('pacchetti_massaggi').insert([{
                email_cliente: email,
                nome_pacchetto: nome || 'Pacchetto Massaggi Sportivi',
                sedute_rimaste: sedute
            }]);

            if (error) {
                alert("Errore pacchetto: " + error.message);
            } else {
                alert("Pacchetto massaggi aggiornato con successo!");
            }
        }

        async function salvaMisureAdmin() {
            const email = document.getElementById('emailClienteMisure').value.trim();
            if (!email) {
                alert("Inserisci l'email del cliente.");
                return;
            }

            const peso = document.getElementById('mPeso').value;
            const petto = document.getElementById('mPetto').value;
            const spalle = document.getElementById('mSpalle').value;
            const braccio = document.getElementById('mBraccio').value;
            const vita = document.getElementById('mVita').value;
            const fianchi = document.getElementById('mFianchi').value;
            const quadricipiti = document.getElementById('mQuadricipiti').value;
            const polpacci = document.getElementById('mPolpacci').value;

            const { error } = await db.from('misure_clienti').insert([{
                email_cliente: email,
                peso, petto, spalle, braccio, vita, fianchi, quadricipiti, polpacci
            }]);

            if (error) {
                alert("Errore misure: " + error.message);
            } else {
                alert("Misure registrate con successo per " + email);
                document.getElementById('mPeso').value = '';
                document.getElementById('mPetto').value = '';
                document.getElementById('mSpalle').value = '';
                document.getElementById('mBraccio').value = '';
                document.getElementById('mVita').value = '';
                document.getElementById('mFianchi').value = '';
                document.getElementById('mQuadricipiti').value = '';
                document.getElementById('mPolpacci').value = '';
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            aggiungiBloccoEsercizio();
            caricaGifDaGitHub();
        });
    </script>
</body>
</html>
