<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Admin - LR Studio PT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #08090b;
            --card-bg: rgba(18, 20, 25, 0.88);
            --card-border: rgba(212, 175, 55, 0.22);
            --gold-main: #d4af37;
            --gold-gradient: linear-gradient(135deg, #f5e29f 0%, #d4af37 50%, #9e7b17 100%);
            --input-bg: #121418;
            --input-border: #262930;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(212, 175, 55, 0.08) 0%, transparent 60%),
                radial-gradient(circle at 50% 100%, rgba(20, 22, 28, 0.8) 0%, transparent 100%);
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .admin-panel {
            width: 100%;
            max-width: 660px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 26px 22px;
            box-sizing: border-box;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 12px 35px rgba(0,0,0,0.7);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .header-brand { display: flex; align-items: center; gap: 10px; }
        .header-badge {
            width: 32px; height: 32px; border-radius: 8px;
            background: rgba(212, 175, 55, 0.12);
            border: 1px solid rgba(212, 175, 55, 0.4);
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 0.82rem; color: var(--gold-main);
        }
        .header h1 {
            color: #fff; font-size: 1.15rem; margin: 0;
            text-transform: uppercase; font-weight: 800; letter-spacing: 1px;
        }
        .header h1 span {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-btn {
            background: rgba(255, 255, 255, 0.04);
            color: #9aa1af; border: 1px solid #282b34;
            padding: 7px 13px; border-radius: 8px;
            font-size: 0.74rem; cursor: pointer;
            text-transform: uppercase; font-weight: 700;
            transition: all 0.2s ease;
        }
        .header-btn:hover { border-color: var(--gold-main); color: #fff; }

        .form-group { margin-bottom: 15px; position: relative; }
        label {
            display: block; font-size: 0.7rem; color: #8c929e;
            text-transform: uppercase; margin-bottom: 6px;
            font-weight: 600; letter-spacing: 0.5px;
        }
        input, select {
            width: 100%; background: var(--input-bg);
            border: 1px solid var(--input-border); color: #fff;
            padding: 11px 12px; border-radius: 9px;
            font-family: 'Montserrat', sans-serif; font-size: 0.86rem;
            box-sizing: border-box; transition: border-color 0.2s;
        }
        input:focus, select:focus { border-color: var(--gold-main); outline: none; }
        
        .autocomplete-dropdown {
            display: none; position: absolute; top: 100%; left: 0; right: 0;
            background: #14161d; border: 1px solid var(--gold-main);
            border-radius: 0 0 10px 10px; max-height: 200px;
            overflow-y: auto; z-index: 999;
            box-shadow: 0 8px 25px rgba(0,0,0,0.9);
        }
        .autocomplete-item {
            padding: 11px 13px; font-size: 0.82rem; color: #ddd;
            cursor: pointer; border-bottom: 1px solid #20242e;
        }
        .autocomplete-item:hover { background: var(--gold-main); color: #08090b; font-weight: 700; }

        .grid-pin { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
        .action-bar-top { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .btn-load {
            background: #161820; color: var(--gold-main);
            border: 1px solid rgba(212, 175, 55, 0.5); padding: 12px;
            border-radius: 9px; font-size: 0.78rem; font-weight: 800;
            text-transform: uppercase; cursor: pointer; transition: all 0.2s ease;
        }
        .btn-load:hover { background: rgba(212, 175, 55, 0.15); }
        .btn-reset {
            background: #13151b; color: #9aa1af;
            border: 1px solid #282c36; padding: 12px;
            border-radius: 9px; font-size: 0.78rem; font-weight: 800;
            text-transform: uppercase; cursor: pointer; transition: all 0.2s ease;
        }
        .btn-reset:hover { border-color: var(--gold-main); color: #fff; }
        
        .badge-status {
            display: none; padding: 11px 14px; border-radius: 8px;
            font-size: 0.76rem; margin-bottom: 16px; text-align: center; font-weight: 600;
        }
        .badge-info { background: rgba(212, 175, 55, 0.12); color: var(--gold-main); border: 1px solid rgba(212, 175, 55, 0.3); }
        .badge-success { background: rgba(16, 185, 129, 0.12); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-warn { background: rgba(231, 76, 60, 0.12); color: #ff7675; border: 1px solid rgba(231, 76, 60, 0.3); }

        .days-tab-bar {
            display: flex; gap: 8px; overflow-x: auto;
            padding-bottom: 10px; margin-top: 20px; margin-bottom: 15px;
            border-bottom: 1px solid #1f2229;
        }
        .day-tab-btn {
            background: #14161c; color: #828997; border: 1px solid #262930;
            padding: 9px 15px; border-radius: 7px; font-size: 0.80rem;
            font-weight: 700; cursor: pointer; white-space: nowrap;
            transition: all 0.2s ease;
        }
        .day-tab-btn.active { background: var(--gold-gradient); color: #08090b; border-color: transparent; font-weight: 800; }
        .btn-add-day {
            background: transparent; color: var(--gold-main); border: 1px dashed var(--gold-main);
            padding: 9px 15px; border-radius: 7px; font-size: 0.8rem; font-weight: 700; cursor: pointer; white-space: nowrap;
        }
        .day-title-editor {
            display: flex; gap: 10px; align-items: center; margin-bottom: 15px;
            background: #14161c; padding: 10px; border-radius: 9px; border: 1px solid #232732;
        }
        .day-title-editor input { font-weight: 700; color: var(--gold-main); }
        .btn-delete-day {
            background: rgba(231, 76, 60, 0.15); border: 1px solid #e74c3c;
            color: #ff7675; padding: 10px 14px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; cursor: pointer;
        }
        .ex-card {
            background: #0c0e12; border: 1px solid #1f2229;
            border-radius: 12px; padding: 16px; margin-bottom: 16px;
        }
        .ex-card-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
        }
        .ex-index { color: var(--gold-main); font-size: 0.84rem; font-weight: 800; }
        .btn-remove-ex { background: transparent; border: none; color: #ff7675; font-size: 0.8rem; cursor: pointer; font-weight: 700; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        
        .gif-row-container { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
        .preview-box {
            display: flex; align-items: center; gap: 10px;
            background: #14161d; border: 1px solid #232732; border-radius: 8px; padding: 10px;
        }
        .preview-box img { width: 42px; height: 42px; object-fit: cover; border-radius: 6px; border: 1px solid var(--gold-main); background: #000; flex-shrink: 0; }
        .btn-add-gif-row {
            background: transparent; color: var(--gold-main); border: 1px dashed var(--gold-main); padding: 9px; border-radius: 7px;
            font-size: 0.74rem; font-weight: 700; cursor: pointer; text-transform: uppercase; width: 100%; margin-bottom: 10px;
        }
        .btn-remove-gif { background: transparent; border: none; color: #ff7675; font-size: 0.85rem; cursor: pointer; font-weight: 700; padding: 4px 8px; }

        .btn-add-ex {
            width: 100%; background: #14161d; color: #9aa1af; border: 1px dashed #3a3f4e;
            padding: 13px; border-radius: 9px; font-size: 0.8rem; font-weight: 700;
            cursor: pointer; text-transform: uppercase; margin-bottom: 20px;
        }
        .btn-submit {
            width: 100%; background: var(--gold-gradient); color: #08090b; border: none;
            padding: 15px; border-radius: 10px; font-size: 0.88rem; font-weight: 800;
            text-transform: uppercase; cursor: pointer; letter-spacing: 1.5px;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.25); transition: all 0.25s ease;
        }
        .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4); }
    </style>
</head>
<body>

    <div class="admin-panel">
        <div class="header">
            <div class="header-brand">
                <div class="header-badge">LR</div>
                <h1>LR <span>Studio PT</span> Admin</h1>
            </div>
            <button class="header-btn" onclick="window.location.href='index.html'">Esci</button>
        </div>

        <div class="grid-pin">
            <div class="form-group" style="position: relative;">
                <label for="clienteNomeCognome">Nome Atleta</label>
                <input type="text" id="clienteNomeCognome" placeholder="es. Luca Torre" oninput="generaIdCliente()" autocomplete="off" spellcheck="false">
                <div id="clientiDropdown" class="autocomplete-dropdown"></div>
            </div>
            <div class="form-group">
                <label for="clientePin">PIN (4 cifre)</label>
                <input type="text" id="clientePin" placeholder="1234" maxlength="4" style="text-align: center; font-weight: 800; color: var(--gold-main); font-size: 1.1rem;" spellcheck="false">
            </div>
        </div>
        <input type="hidden" id="clientId">

        <div class="action-bar-top">
            <button type="button" class="btn-load" onclick="caricaSchedaEsistente()">🔍 Carica Scheda</button>
            <button type="button" class="btn-reset" onclick="inizializzaNuovoAtleta()">➕ Nuovo Atleta</button>
        </div>
        <div id="statusBadge" class="badge-status badge-info"></div>

        <div class="days-tab-bar" id="tabsContainer"></div>
        <div style="margin-bottom: 15px;">
            <button type="button" class="btn-add-day" onclick="aggiungiNuovoGiorno()">+ Aggiungi Giorno</button>
        </div>

        <div class="day-title-editor">
            <input type="text" id="activeDayTitle" placeholder="Nome Giorno (es. Giorno A)" oninput="aggiornaTitoloGiornoCorrente(this.value)" spellcheck="false">
            <button type="button" class="btn-delete-day" onclick="eliminaGiornoCorrente()">Elimina Giorno</button>
        </div>

        <div id="listaEserciziEditor"></div>
        <button type="button" class="btn-add-ex" onclick="aggiungiNuovoEsercizioCard()">+ Aggiungi Esercizio</button>
        <button type="button" id="btnSalvaScheda" class="btn-submit" onclick="salvaTuttoIlProgramma()">💾 Salva Scheda Completa</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://xhgxosffgsuokrsycvyd.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhoZ3hvc2ZmZ3N1b2tyc3ljdnlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMTgyNzgsImV4cCI6MjEwMzY5NDI3OH0.OGkhaS3O-aWXV65tV3uwMpo9VmCmr3Hgubfn2ShuVMg';
        const db = window.supabase.createClient(supabaseUrl, supabaseKey);

        let archivioGifEsercizi = [];
        let listaClientiEsistenti = [];
        let programmaSettimanale = [
            { titolo: "Giorno A", esercizi: [] },
            { titolo: "Giorno B", esercizi: [] }
        ];
        let indiceGiornoAttivo = 0;

        function mostraAvviso(testo, tipo = 'badge-info') {
            const badge = document.getElementById('statusBadge');
            badge.className = `badge-status ${tipo}`;
            badge.innerText = testo;
            badge.style.display = 'block';
        }

        function generaIdCliente() {
            const nomeCompleto = document.getElementById('clienteNomeCognome').value.trim();
            // Normalizza con trattini (es. "Luca Torre" -> "luca-torre") compatibile con dashboard.html
            const idFormattato = nomeCompleto.toLowerCase().replace(/\s+/g, '-').replace(/[^\w-]/g, '');
            document.getElementById('clientId').value = idFormattato;
        }

        function inizializzaNuovoAtleta() {
            document.getElementById('clienteNomeCognome').value = "";
            document.getElementById('clientePin').value = "";
            document.getElementById('clientId').value = "";
            programmaSettimanale = [
                { titolo: "Giorno A", esercizi: [] },
                { titolo: "Giorno B", esercizi: [] }
            ];
            indiceGiornoAttivo = 0;
            renderTabsGiorni();
            mostraAvviso("Nuova scheda pronta. Inserisci nome, PIN e compila gli esercizi.", "badge-info");
        }

        async function caricaListaClientiSuggeriti() {
            try {
                const { data } = await db.from('schede_clienti').select('client_id, email_cliente');
                if (data && data.length > 0) {
                    const unique = new Set();
                    data.forEach(c => {
                        if (c.client_id) unique.add(c.client_id);
                        if (c.email_cliente) unique.add(c.email_cliente);
                    });
                    listaClientiEsistenti = Array.from(unique);
                }
            } catch(e) {}
        }

        const inputCliente = document.getElementById('clienteNomeCognome');
        const dropdownClienti = document.getElementById('clientiDropdown');

        inputCliente.addEventListener('input', function() {
            const val = this.value.trim().toLowerCase();
            if (!val || listaClientiEsistenti.length === 0) {
                dropdownClienti.style.display = 'none';
                return;
            }
            const match = listaClientiEsistenti.filter(c => c.toLowerCase().includes(val));
            if (match.length > 0) {
                dropdownClienti.innerHTML = '';
                match.forEach(c => {
                    const item = document.createElement('div');
                    item.className = 'autocomplete-item';
                    item.innerText = c.replace(/-/g, ' ');
                    item.onclick = () => {
                        inputCliente.value = c.replace(/-/g, ' ');
                        generaIdCliente();
                        dropdownClienti.style.display = 'none';
                        caricaSchedaEsistente();
                    };
                    dropdownClienti.appendChild(item);
                });
                dropdownClienti.style.display = 'block';
            } else {
                dropdownClienti.style.display = 'none';
            }
        });

        function renderTabsGiorni() {
            const container = document.getElementById('tabsContainer');
            if (!container) return;
            container.innerHTML = "";
            
            programmaSettimanale.forEach((giorno, idx) => {
                const btn = document.createElement('button');
                btn.type = "button";
                btn.className = `day-tab-btn ${idx === indiceGiornoAttivo ? 'active' : ''}`;
                btn.innerText = giorno.titolo || `Giorno ${idx + 1}`;
                btn.onclick = (e) => {
                    e.preventDefault();
                    cambiaGiorno(idx);
                };
                container.appendChild(btn);
            });

            const inputTitolo = document.getElementById('activeDayTitle');
            if (inputTitolo && programmaSettimanale[indiceGiornoAttivo]) {
                inputTitolo.value = programmaSettimanale[indiceGiornoAttivo].titolo;
            }
            renderEserciziGiornoAttivo();
        }

        function cambiaGiorno(nuovoIndice) {
            salvaDatiFormNelGiornoAttivo();
            indiceGiornoAttivo = nuovoIndice;
            renderTabsGiorni();
        }

        function aggiungiNuovoGiorno() {
            salvaDatiFormNelGiornoAttivo();
            const lettere = ["A", "B", "C", "D", "E", "F"];
            const nextLettera = lettere[programmaSettimanale.length] || (programmaSettimanale.length + 1);
            programmaSettimanale.push({ titolo: `Giorno ${nextLettera}`, esercizi: [] });
            indiceGiornoAttivo = programmaSettimanale.length - 1;
            renderTabsGiorni();
        }

        function eliminaGiornoCorrente() {
            if (programmaSettimanale.length <= 1) {
                alert("Devi mantenere almeno un giorno.");
                return;
            }
            programmaSettimanale.splice(indiceGiornoAttivo, 1);
            indiceGiornoAttivo = Math.max(0, indiceGiornoAttivo - 1);
            renderTabsGiorni();
        }

        function aggiornaTitoloGiornoCorrente(nuovoTitolo) {
            if (!programmaSettimanale[indiceGiornoAttivo]) return;
            programmaSettimanale[indiceGiornoAttivo].titolo = nuovoTitolo;
            const buttons = document.querySelectorAll('.day-tab-btn');
            if (buttons[indiceGiornoAttivo]) {
                buttons[indiceGiornoAttivo].innerText = nuovoTitolo || "Giorno";
            }
        }

        function salvaDatiFormNelGiornoAttivo() {
            if (!programmaSettimanale[indiceGiornoAttivo]) return;
            const cards = document.querySelectorAll('.ex-card');
            let eserciziArray = [];
            cards.forEach(card => {
                const nomeInput = card.querySelector('.input-nome');
                const targetInput = card.querySelector('.input-target');
                const recInput = card.querySelector('.input-recupero');
                const videoInput = card.querySelector('.input-video');
                const noteCoachInput = card.querySelector('.input-note-coach');

                if (!nomeInput) return;
                const nome = nomeInput.value.trim();
                const target = targetInput ? targetInput.value.trim() : "3x10";
                const recupero = recInput ? (parseInt(recInput.value) || 90) : 90;
                const note_coach = noteCoachInput ? noteCoachInput.value.trim() : "";
                
                let gifsArray = [];
                card.querySelectorAll('.input-gif-hidden').forEach(inp => {
                    if (inp.value.trim()) gifsArray.push(inp.value.trim());
                });

                const video = videoInput ? videoInput.value.trim() : "";
                const ultimo_peso = card.dataset.ultimoPeso || "";
                const storico = card.dataset.storico ? JSON.parse(card.dataset.storico) : [];

                if (nome !== "") {
                    eserciziArray.push({ nome, target, recupero, gifs: gifsArray, video, note_coach, ultimo_peso, storico });
                }
            });
            programmaSettimanale[indiceGiornoAttivo].esercizi = eserciziArray;
        }

        function renderEserciziGiornoAttivo() {
            const container = document.getElementById('listaEserciziEditor');
            if (!container) return;
            container.innerHTML = "";
            const giorno = programmaSettimanale[indiceGiornoAttivo];
            if (!giorno || !giorno.esercizi || giorno.esercizi.length === 0) {
                creaCardEsercizio();
            } else {
                giorno.esercizi.forEach((ex, idx) => creaCardEsercizio(ex, idx));
            }
        }

        function popolaSelectGifManuale(selectEl, selectedPath = "") {
            selectEl.innerHTML = '<option value="">-- Seleziona GIF --</option>';
            archivioGifEsercizi.forEach(ex => {
                const opt = document.createElement('option');
                opt.value = ex.percorso;
                opt.innerText = ex.nome;
                if (ex.percorso === selectedPath) opt.selected = true;
                selectEl.appendChild(opt);
            });
        }

        function aggiornaGifManuale(selectEl) {
            const box = selectEl.closest('.preview-box');
            if (!box) return;
            const percorso = selectEl.value;
            const hiddenInput = box.querySelector('.input-gif-hidden');
            const previewImg = box.querySelector('.img-preview');

            if (hiddenInput) hiddenInput.value = percorso;
            if (previewImg) {
                previewImg.src = percorso ? percorso : 'data:image/svg+xml,<svg xmlns=\'http://www.w3.org/2000/svg\'/>';
            }
        }

        function aggiungiRiquadroGif(card, percorsoGif = "") {
            const container = card.querySelector('.gif-row-container');
            if (!container) return;
            const box = document.createElement('div');
            box.className = "preview-box";
            box.innerHTML = `
                <img class="img-preview" src="${percorsoGif || 'data:image/svg+xml,<svg xmlns=\'http://www.w3.org/2000/svg\'/>'}" alt="Preview">
                <div style="flex-grow: 1;">
                    <label style="margin-bottom: 3px;">Seleziona GIF</label>
                    <select class="select-gif-manuale" onchange="aggiornaGifManuale(this)">
                        <option value="">-- Seleziona GIF --</option>
                    </select>
                </div>
                <button type="button" class="btn-remove-gif" onclick="this.closest('.preview-box').remove()">✕</button>
                <input type="hidden" class="input-gif-hidden" value="${percorsoGif || ''}">
            `;
            container.appendChild(box);
            const selectEl = box.querySelector('.select-gif-manuale');
            popolaSelectGifManuale(selectEl, percorsoGif);
        }

        function creaCardEsercizio(dati = {}, index = null) {
            const container = document.getElementById('listaEserciziEditor');
            if (!container) return;
            const currentIndex = (index !== null) ? index : container.children.length;
            const card = document.createElement('div');
            card.className = "ex-card";
            card.dataset.ultimoPeso = dati.ultimo_peso || "";
            card.dataset.storico = JSON.stringify(dati.storico || []);

            card.innerHTML = `
                <div class="ex-card-header">
                    <span class="ex-index">Esercizio #${currentIndex + 1}</span>
                    <button type="button" class="btn-remove-ex" onclick="this.closest('.ex-card').remove(); rinumeraEsercizi();">✕ Rimuovi</button>
                </div>
                <div class="form-group" style="position: relative;">
                    <label>Nome Esercizio</label>
                    <input type="text" class="input-nome" placeholder="es. Panca inclinata, Trazioni..." value="${dati.nome || ''}" autocomplete="off" spellcheck="false">
                    <div class="autocomplete-dropdown"></div>
                </div>
                <div class="grid-2">
                    <div>
                        <label>Target</label>
                        <input type="text" class="input-target" value="${dati.target || '3x10'}" spellcheck="false">
                    </div>
                    <div>
                        <label>Recupero (s)</label>
                        <input type="number" class="input-recupero" value="${dati.recupero || 90}">
                    </div>
                </div>

                <div class="form-group" style="margin-top: 10px;">
                    <label style="color: var(--gold-main);">Istruzioni / Tecniche Coach (Visibili all'atleta)</label>
                    <input type="text" class="input-note-coach" placeholder="es. Rest-pause: 8 rip, pausa 5s, chiudi a cedimento" value="${dati.note_coach || ''}" spellcheck="false">
                </div>

                <label style="margin-top: 10px; color: var(--gold-main);">Riquadri GIF (Aggiungine altri per superserie)</label>
                <div class="gif-row-container"></div>
                <button type="button" class="btn-add-gif-row" onclick="aggiungiRiquadroGif(this.closest('.ex-card'))">+ Aggiungi riquadro GIF</button>

                <div class="form-group" style="margin-bottom:0; margin-top: 10px;">
                    <label>Link Video</label>
                    <input type="text" class="input-video" placeholder="https://..." value="${dati.video || ''}" spellcheck="false">
                </div>
            `;
            container.appendChild(card);

            // Listener per l'autocompletamento in tempo reale
            const inputNome = card.querySelector('.input-nome');
            const dropdown = card.querySelector('.autocomplete-dropdown');
            
            inputNome.addEventListener('input', function() {
                const testo = this.value.trim().toLowerCase();
                if (!testo || archivioGifEsercizi.length === 0) {
                    dropdown.style.display = 'none';
                    dropdown.innerHTML = '';
                    return;
                }
                const filtrati = archivioGifEsercizi.filter(ex => ex.nome.toLowerCase().includes(testo));
                if (filtrati.length > 0) {
                    dropdown.innerHTML = '';
                    filtrati.forEach(ex => {
                        const item = document.createElement('div');
                        item.className = 'autocomplete-item';
                        item.innerText = ex.nome;
                        item.onclick = () => {
                            inputNome.value = ex.nome;
                            const primaSelect = card.querySelector('.select-gif-manuale');
                            if (primaSelect) {
                                primaSelect.value = ex.percorso;
                                aggiornaGifManuale(primaSelect);
                            }
                            dropdown.style.display = 'none';
                        };
                        dropdown.appendChild(item);
                    });
                    dropdown.style.display = 'block';
                } else {
                    dropdown.style.display = 'none';
                    dropdown.innerHTML = '';
                }
            });

            let listaGifs = dati.gifs || (dati.gif ? [dati.gif] : []);
            if (listaGifs.length === 0) {
                aggiungiRiquadroGif(card);
            } else {
                listaGifs.forEach(g => aggiungiRiquadroGif(card, g));
            }
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.form-group')) {
                document.querySelectorAll('.autocomplete-dropdown').forEach(d => d.style.display = 'none');
            }
        });

        function aggiungiNuovoEsercizioCard() { creaCardEsercizio(); }
        function rinumeraEsercizi() {
            document.querySelectorAll('.ex-card').forEach((card, idx) => {
                card.querySelector('.ex-index').innerText = `Esercizio #${idx + 1}`;
            });
        }

        async function popolaArchivioGifDaGitHub() {
            try {
                let owner = "luigirosati";
                let repo = "studio-pt";
                if (window.location.hostname.includes("github.io")) {
                    owner = window.location.hostname.split('.')[0];
                    repo = window.location.pathname.split('/')[1] || repo;
                }
                const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/esercizi`);
                if (!res.ok) return;
                const items = await res.json();
                archivioGifEsercizi = [];
                for (const item of items) {
                    if (item.type === "file" && item.name.match(/\.(gif|mp4|webp|png|jpg)$/i)) {
                        archivioGifEsercizi.push({ nome: item.name.replace(/\.[^/.]+$/, "").replace(/_/g, " "), percorso: item.path });
                    } else if (item.type === "dir") {
                        const subRes = await fetch(item.url);
                        if (subRes.ok) {
                            const subItems = await subRes.json();
                            subItems.forEach(sub => {
                                if (sub.name.match(/\.(gif|mp4|webp|png|jpg)$/i)) {
                                    archivioGifEsercizi.push({ nome: sub.name.replace(/\.[^/.]+$/, "").replace(/_/g, " "), percorso: sub.path });
                                }
                            });
                        }
                    }
                }
                // Aggiorna tutte le tendine manuali con l'archivio reale
                document.querySelectorAll('.select-gif-manuale').forEach(sel => {
                    const currentVal = sel.value;
                    popolaSelectGifManuale(sel, currentVal);
                });
            } catch (e) {
                console.warn("Impossibile caricare archivio GIF");
            }
        }

        async function caricaSchedaEsistente() {
            generaIdCliente();
            const clientId = document.getElementById('clientId').value.trim();
            const rawNome = document.getElementById('clienteNomeCognome').value.trim().toLowerCase();
            if (!clientId) { alert("Inserisci il nome."); return; }
            mostraAvviso("Caricamento...");

            try {
                const { data, error } = await db.from('schede_clienti')
                    .select('*')
                    .or(`client_id.eq.${clientId},email_cliente.eq.${clientId},client_id.eq.${rawNome},email_cliente.eq.${rawNome}`);
                
                if (error) throw error;
                if (!data || data.length === 0) { 
                    mostraAvviso("Nessuna scheda trovata per questo atleta. Premi 'Nuovo Atleta' per crearla da zero.", "badge-warn"); 
                    return; 
                }

                if (data[0].pin) document.getElementById('clientePin').value = data[0].pin;

                if (data.length === 1 && (data[0].titolo_sessione === "PROGRAMMA_COMPLETO" || (typeof data[0].dati_scheda === 'string' && data[0].dati_scheda.trim().startsWith('[{"titolo"')))) {
                    programmaSettimanale = JSON.parse(data[0].dati_scheda);
                } else {
                    programmaSettimanale = data.map(riga => ({
                        titolo: riga.titolo_sessione || "Giorno A",
                        esercizi: JSON.parse(riga.dati_scheda || "[]")
                    }));
                }

                indiceGiornoAttivo = 0;
                renderTabsGiorni();
                mostraAvviso("✅ Scheda caricata con successo!", "badge-success");
            } catch (err) {
                alert("Errore: " + err.message);
            }
        }

        async function salvaTuttoIlProgramma() {
            salvaDatiFormNelGiornoAttivo();
            generaIdCliente();
            const clientId = document.getElementById('clientId').value.trim();
            const pin = document.getElementById('clientePin').value.trim();
            const btn = document.getElementById('btnSalvaScheda');

            if (!clientId) { alert("Inserisci il nome."); return; }
            if (!pin || pin.length !== 4) { alert("Inserisci un PIN di 4 cifre."); return; }

            btn.disabled = true;
            btn.innerText = "Salvataggio...";

            try {
                // Rimuove eventuali vecchie configurazioni frammentate per salvare il blocco unico
                await db.from('schede_clienti').delete().or(`client_id.eq.${clientId},email_cliente.eq.${clientId}`);
                
                const { error } = await db.from('schede_clienti').insert([{
                    client_id: clientId,
                    email_cliente: clientId,
                    pin: pin,
                    titolo_sessione: "PROGRAMMA_COMPLETO",
                    dati_scheda: JSON.stringify(programmaSettimanale)
                }]);

                if (error) throw error;
                mostraAvviso("✅ Scheda salvata con successo!", "badge-success");
                alert("✅ Scheda salvata con successo!");
                caricaListaClientiSuggeriti();
            } catch (err) {
                alert("Errore: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "💾 Salva Scheda Completa";
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            popolaArchivioGifDaGitHub();
            caricaListaClientiSuggeriti();
            renderTabsGiorni();
        });
    </script>
</body>
</html>
