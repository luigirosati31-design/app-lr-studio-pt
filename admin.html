<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Admin - Studio PT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .admin-panel {
            width: 100%;
            max-width: 650px;
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 25px 20px;
            box-sizing: border-box;
            box-shadow: 0 8px 30px rgba(0,0,0,0.7);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #d4af37;
            font-size: 1.2rem;
            margin: 0;
            text-transform: uppercase;
            font-weight: 700;
        }
        .header-btn {
            background: transparent;
            color: #888;
            border: 1px solid #333;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            text-transform: uppercase;
        }
        .form-group { margin-bottom: 15px; position: relative; }
        label {
            display: block;
            font-size: 0.72rem;
            color: #aaa;
            text-transform: uppercase;
            margin-bottom: 6px;
            font-weight: 600;
        }
        input, select {
            width: 100%;
            background: #181818;
            border: 1px solid #333;
            color: #fff;
            padding: 10px 12px;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            box-sizing: border-box;
        }
        input:focus, select:focus { border-color: #d4af37; outline: none; }
        
        .autocomplete-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #1a1a1a;
            border: 1px solid #d4af37;
            border-radius: 0 0 8px 8px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 999;
            box-shadow: 0 8px 20px rgba(0,0,0,0.9);
        }
        .autocomplete-item {
            padding: 10px 12px;
            font-size: 0.82rem;
            color: #ddd;
            cursor: pointer;
            border-bottom: 1px solid #222;
        }
        .autocomplete-item:hover {
            background: #d4af37;
            color: #000;
            font-weight: 600;
        }

        .grid-pin { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
        .btn-load {
            width: 100%;
            background: #1e1e1e;
            color: #d4af37;
            border: 1px solid #d4af37;
            padding: 11px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            margin-bottom: 15px;
        }
        .badge-status {
            display: none;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.75rem;
            margin-bottom: 15px;
            text-align: center;
        }
        .badge-info { background: rgba(212, 175, 55, 0.15); color: #d4af37; border: 1px solid #d4af37; }
        .badge-success { background: rgba(46, 204, 113, 0.15); color: #2ecc71; border: 1px solid #2ecc71; }
        .days-tab-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-top: 20px;
            margin-bottom: 15px;
            border-bottom: 1px solid #222;
        }
        .day-tab-btn {
            background: #161616;
            color: #888;
            border: 1px solid #333;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .day-tab-btn.active { background: #d4af37; color: #000; border-color: #d4af37; }
        .btn-add-day {
            background: transparent;
            color: #d4af37;
            border: 1px dashed #d4af37;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
        }
        .day-title-editor {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
            background: #161616;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #262626;
        }
        .day-title-editor input { font-weight: 700; color: #d4af37; }
        .btn-delete-day {
            background: rgba(231, 76, 60, 0.15);
            border: 1px solid #e74c3c;
            color: #ff6b6b;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
        }
        .ex-card {
            background: #0d0d0d;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 14px;
        }
        .ex-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .ex-index { color: #d4af37; font-size: 0.82rem; font-weight: 700; }
        .btn-remove-ex { background: transparent; border: none; color: #e74c3c; font-size: 0.8rem; cursor: pointer; font-weight: 700; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        
        .gif-row-container { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
        .preview-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #141414;
            border: 1px solid #222;
            border-radius: 6px;
            padding: 10px;
        }
        .preview-box img { width: 42px; height: 42px; object-fit: cover; border-radius: 4px; border: 1px solid #d4af37; background: #000; flex-shrink: 0; }
        .btn-add-gif-row {
            background: transparent; color: #d4af37; border: 1px dashed #d4af37; padding: 8px; border-radius: 6px;
            font-size: 0.75rem; font-weight: 700; cursor: pointer; text-transform: uppercase; width: 100%; margin-bottom: 10px;
        }
        .btn-remove-gif { background: transparent; border: none; color: #e74c3c; font-size: 0.85rem; cursor: pointer; font-weight: 700; padding: 4px 8px; }

        .btn-add-ex {
            width: 100%;
            background: #161616;
            color: #888;
            border: 1px dashed #444;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            margin-bottom: 20px;
        }
        .btn-submit {
            width: 100%;
            background: #d4af37;
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="admin-panel">
        <div class="header">
            <h1>Studio PT - Admin</h1>
            <button class="header-btn" onclick="window.location.href='index.html'">Esci</button>
        </div>

        <div class="grid-pin">
            <div class="form-group">
                <label for="clienteNomeCognome">Nome Atleta</label>
                <input type="text" id="clienteNomeCognome" placeholder="es. Enrico Lombardi" oninput="generaIdCliente()">
            </div>
            <div class="form-group">
                <label for="clientePin">PIN (4 cifre)</label>
                <input type="text" id="clientePin" placeholder="1234" maxlength="4" style="text-align: center; font-weight: 700; color: #d4af37; font-size: 1.1rem;">
            </div>
        </div>
        <input type="hidden" id="clientId">

        <button type="button" class="btn-load" onclick="caricaSchedaEsistente()">🔍 Carica Scheda</button>
        <div id="statusBadge" class="badge-status badge-info"></div>

        <div class="days-tab-bar">
            <div id
