<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Admin - Gestione Schede - Studio PT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .admin-panel {
            width: 100%;
            max-width: 600px;
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 25px 20px;
            box-sizing: border-box;
            box-shadow: 0 8px 30px rgba(0,0,0,0.7);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #d4af37;
            font-size: 1.2rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .logout-btn {
            background: transparent;
            color: #888;
            border: 1px solid #333;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            text-transform: uppercase;
            font-family: 'Montserrat', sans-serif;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 0.72rem;
            color: #aaa;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 1px;
            font-weight: 600;
        }
        input, select {
            width: 100%;
            background: #181818;
            border: 1px solid #333;
            color: #fff;
            padding: 10px 12px;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            box-sizing: border-box;
        }
        input:focus, select:focus {
            border-color: #d4af37;
            outline: none;
        }
        .btn-load {
            width: 100%;
            background: #1e1e1e;
            color: #d4af37;
            border: 1px solid #d4af37;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 5px;
            margin-bottom: 20px;
            font-family: 'Montserrat', sans-serif;
            transition: all 0.2s;
        }
        .btn-load:active {
            background: #d4af37;
            color: #000;
        }
        .badge-status {
            display: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            margin-bottom: 15px;
            text-align: center;
        }
        .badge-info { background: rgba(212, 175, 55, 0.15); color: #d4af37; border: 1px solid #d4af37; }
        
        .section-title {
            color: #d4af37;
            font-size: 0.85rem;
            text-transform: uppercase;
            margin: 20px 0 10px 0;
            border-bottom: 1px solid #222;
            padding-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        /* CARD SINGOLO ESERCIZIO NELL'EDITOR */
        .ex-card {
            background: #0d0d0d;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            position: relative;
        }
        .ex-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .ex-index {
            color: #d4af37;
            font-size: 0.8rem;
            font-weight: 700;
        }
        .btn-remove-ex {
            background: transparent;
            border: none;
            color: #e74c3c;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 700;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }
        .btn-add-ex {
            width: 100%;
            background: #161616;
            color: #888;
            border: 1px dashed #444;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            margin-bottom: 20px;
            font-family: 'Montserrat', sans-serif;
        }
        .btn-add-ex:hover {
            color: #d4af37;
            border-color: #d4af37;
        }
        .btn-submit {
            width: 100%;
            background: #d4af37;
            color: #000;
            border: none;
            padding: 13px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 1px;
        }
        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="admin-panel">
        <div class="header">
            <h1>Studio PT - Admin</h1>
            <button class="logout-btn" onclick="faiLogout()">Esci</button>
        </div>

        <!-- SELEZIONE CLIENTE E SESSIONE -->
        <div class="form-group">
            <label for="clienteEmail">Email Cliente</label>
            <input type="email" id="clienteEmail" placeholder="es. cliente@email.com" required>
        </div>

        <div class="form-group">
            <label for="titoloSessione">Nome Sessione / Giorno</label>
            <input type="text" id="titoloSessione" placeholder="es. Giorno A (Petto - Tricipiti)" value="Giorno A">
        </div>

        <!-- TASTO DI CARICAMENTO AUTOMATICO SCHEDA ESISTENTE -->
        <button type="button" class="btn-load" onclick="caricaSchedaEsistente()">🔍 Carica Scheda Già Salvata</button>
        
        <div id="statusBadge" class="badge-status badge-info"></div>

        <!-- EDITOR DEGLI ESERCIZI -->
        <div class="section-title">
            <span>Esercizi nella Scheda</span>
        </div>

        <div id="listaEserciziEditor"></div>

        <button type="button" class="btn-add-ex" onclick="aggiungiNuovoEsercizioCard()">+ Aggiungi Nuovo Esercizio</button>

        <button type="button" id="btnSalvaScheda" class="btn-submit" onclick="salvaSchedaSuSupabase()">💾 Invia / Aggiorna Scheda</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://xhgxosffgsuokrsycvyd.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhoZ3hvc2ZmZ3N1b2tyc3ljdnlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMTgyNzgsImV4cCI6MjEwMzY5NDI3OH0.OGkhaS3O-aWXV65tV3uwMpo9VmCmr3Hgubfn2ShuVMg';
        const db = window.supabase.createClient(supabaseUrl, supabaseKey);

        let schedaAttivaCaricataId = null; 
        let storicoEserciziEsistente = []; // Memorizza lo storico carichi per non cancellarlo

        async function faiLogout() {
            await db.auth.signOut();
            window.location.href = "index.html";
        }

        function mostraAvviso(testo) {
            const badge = document.getElementById('statusBadge');
            badge.innerText = testo;
            badge.style.display = 'block';
        }

        // ================= FUNZIONE CHIAVE: CARICA LA SCHEDA ESISTENTE =================
        async function caricaSchedaEsistente() {
            const email = document.getElementById('clienteEmail').value.trim();
            const titolo = document.getElementById('titoloSessione').value.trim();

            if (!email) {
                alert("Inserisci l'email del cliente per cercare la scheda.");
                return;
            }

            mostraAvviso("Ricerca scheda in corso...");

            try {
                // Cerca la scheda con quella email e quel giorno/titolo
                let query = db.from('schede_clienti').select('*').eq('email_cliente', email);
                if (titolo) query = query.eq('titolo_sessione', titolo);

                const { data, error } = await query;

                if (error) throw error;

                if (!data || data.length === 0) {
                    mostraAvviso("Nessuna scheda trovata per questo giorno. Puoi crearne una nuova.");
                    schedaAttivaCaricataId = null;
                    storicoEserciziEsistente = [];
                    return;
                }

                // Scheda trovata!
                const scheda = data[0];
                schedaAttivaCaricataId = scheda.id;
                document.getElementById('titoloSessione').value = scheda.titolo_sessione || "Giorno A";

                const esercizi = JSON.parse(scheda.dati_scheda);
                const container = document.getElementById('listaEserciziEditor');
                container.innerHTML = "";

                storicoEserciziEsistente = esercizi.map(ex => ({
                    ultimo_peso: ex.ultimo_peso || "",
                    storico: ex.storico || []
                }));

                // Precompila tutte le card con i dati già salvati
                esercizi.forEach((ex, idx) => {
                    creaCardEsercizio(ex, idx);
                });

                mostraAvviso(`✅ Scheda caricata! Modifica le GIF o gli esercizi e premi "Aggiorna".`);

            } catch (err) {
                alert("Errore nel recupero scheda: " + err.message);
            }
        }

        function creaCardEsercizio(dati = {}, index = null) {
            const container = document.getElementById('listaEserciziEditor');
            const currentIndex = (index !== null) ? index : container.children.length;

            const card = document.createElement('div');
            card.className = "ex-card";
            card.innerHTML = `
                <div class="ex-card-header">
                    <span class="ex-index">Esercizio #${currentIndex + 1}</span>
                    <button type="button" class="btn-remove-ex" onclick="this.closest('.ex-card').remove(); rinumeraEsercizi();">✕ Rimuovi</button>
                </div>
                <div class="form-group" style="margin-bottom: 8px;">
                    <label>Nome Esercizio</label>
                    <input type="text" class="input-nome" placeholder="es. PANCA PIANA BILANCIERE" value="${dati.nome || ''}">
                </div>
                <div class="grid-2">
                    <div>
                        <label>Target (Serie x Rip)</label>
                        <input type="text" class="input-target" placeholder="es. 4x8 o 3x10" value="${dati.target || '3x10'}">
                    </div>
                    <div>
                        <label>Recupero (secondi)</label>
                        <input type="number" class="input-recupero" placeholder="90" value="${dati.recupero || 90}">
                    </div>
                </div>
                <div class="form-group" style="margin-bottom: 8px;">
                    <label>Percorso / URL GIF</label>
                    <input type="text" class="input-gif" placeholder="es. esercizi/PETTO/panca_piana.gif o link web" value="${dati.gif || ''}">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Link Video Esecuzione (Opzionale)</label>
                    <input type="text" class="input-video" placeholder="https://youtube.com/..." value="${dati.video || ''}">
                </div>
            `;
            container.appendChild(card);
        }

        function aggiungiNuovoEsercizioCard() {
            creaCardEsercizio();
        }

        function rinumeraEsercizi() {
            document.querySelectorAll('.ex-card').forEach((card, idx) => {
                card.querySelector('.ex-index').innerText = `Esercizio #${idx + 1}`;
            });
        }

        // ================= SALVATAGGIO / AGGIORNAMENTO SU SUPABASE =================
        async function salvaSchedaSuSupabase() {
            const email = document.getElementById('clienteEmail').value.trim();
            const titolo = document.getElementById('titoloSessione').value.trim() || "Giorno A";
            const btn = document.getElementById('btnSalvaScheda');

            if (!email) {
                alert("Inserisci l'email del cliente!");
                return;
            }

            const cards = document.querySelectorAll('.ex-card');
            if (cards.length === 0) {
                alert("Aggiungi almeno un esercizio prima di salvare.");
                return;
            }

            let eserciziArray = [];
            cards.forEach((card, idx) => {
                const nome = card.querySelector('.input-nome').value.trim().toUpperCase();
                const target = card.querySelector('.input-target').value.trim() || "3x10";
                const recupero = parseInt(card.querySelector('.input-recupero').value) || 90;
                const gif = card.querySelector('.input-gif').value.trim();
                const video = card.querySelector('.input-video').value.trim();

                // Mantiene lo storico dei pesi se già presente, altrimenti inizializza vuoto
                const fallbackStorico = storicoEserciziEsistente[idx] || {};

                if (nome !== "") {
                    eserciziArray.push({
                        nome: nome,
                        target: target,
                        recupero: recupero,
                        gif: gif,
                        video: video,
                        ultimo_peso: fallbackStorico.ultimo_peso || "",
                        storico: fallbackStorico.storico || []
                    });
                }
            });

            btn.disabled = true;
            btn.innerText = "Salvataggio in corso...";

            try {
                if (schedaAttivaCaricataId) {
                    // MODIFICA DELLA SCHEDA ESISTENTE
                    const { error } = await db
                        .from('schede_clienti')
                        .update({
                            titolo_sessione: titolo,
                            dati_scheda: JSON.stringify(eserciziArray)
                        })
                        .eq('id', schedaAttivaCaricataId);

                    if (error) throw error;
                    alert("✅ Scheda aggiornata con successo con le nuove GIF!");
                } else {
                    // CREAZIONE NUOVA SCHEDA
                    const { error } = await db
                        .from('schede_clienti')
                        .insert([{
                            email_cliente: email,
                            titolo_sessione: titolo,
                            dati_scheda: JSON.stringify(eserciziArray)
                        }]);

                    if (error) throw error;
                    alert("✅ Nuova scheda creata e inviata con successo!");
                }
            } catch (err) {
                alert("Errore salvataggio: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "💾 Invia / Aggiorna Scheda";
            }
        }

        // Crea una prima card vuota all'avvio
        document.addEventListener("DOMContentLoaded", function() {
            aggiungiNuovoEsercizioCard();
        });
    </script>
</body>
</html>
