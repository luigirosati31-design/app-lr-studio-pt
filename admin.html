<!-- admin.html -->
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Admin Panel - LR Studio PT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body{background-color:#000;color:#fff;font-family:'Montserrat',sans-serif;margin:0;padding:20px 20px 60px;display:flex;flex-direction:column;align-items:center}
        .header{width:100%;max-width:500px;display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;padding-bottom:15px;border-bottom:1px solid #333}
        .header h1{color:#d4af37;font-size:1.2rem;margin:0;text-transform:uppercase;letter-spacing:2px;font-weight:700}
        .logout-btn{background:transparent;color:#888;border:1px solid #333;padding:8px 12px;border-radius:8px;font-family:'Montserrat',sans-serif;font-size:.8rem;cursor:pointer;text-transform:uppercase}
        .admin-card{width:100%;max-width:500px;background:#111;border:1px solid #2a2a2a;border-radius:12px;padding:20px;box-sizing:border-box;margin-bottom:20px}
        .admin-card h2{color:#d4af37;margin-top:0;margin-bottom:15px;font-size:1.1rem;text-transform:uppercase;letter-spacing:1px}
        label{display:block;font-size:.75rem;color:#888;text-transform:uppercase;margin-bottom:6px;margin-top:12px}
        input,select,textarea{width:100%;background:#161616;border:1px solid #333;color:#fff;padding:10px;border-radius:8px;font-family:'Montserrat',sans-serif;font-size:.85rem;box-sizing:border-box}
        input:focus,select:focus,textarea:focus{border-color:#d4af37;outline:none}
        select option,select optgroup{background:#111;color:#fff}
        select optgroup{color:#d4af37;font-weight:700}
        .exercise-form-block{background:#0a0a0a;border:1px solid #222;border-radius:8px;padding:15px;margin-top:15px;position:relative}
        .exercise-form-block .remove-btn{position:absolute;top:10px;right:10px;background:transparent;color:#e74c3c;border:none;cursor:pointer;font-size:.85rem;font-weight:700}
        .action-btn{width:100%;padding:12px;border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer;margin-top:15px;text-transform:uppercase}
        .btn-gold{background:#d4af37;color:#000;border:none}
        .btn-outline{background:transparent;color:#d4af37;border:1px dashed #d4af37}
        .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
        .grid-4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
    </style>
</head>
<body>
    <div class="header">
        <h1>Admin LR Studio</h1>
        <button class="logout-btn" onclick="faiLogout()">Esci</button>
    </div>

    <!-- SEZIONE REGISTRAZIONE CLIENTE RAPIDA -->
    <div class="admin-card">
        <h2>👤 Registra Nuovo Cliente</h2>
        <label>Email Cliente</label>
        <input type="email" id="nuovaEmailCliente" placeholder="cliente@email.com">
        <label>Password Temporanea</label>
        <input type="text" id="nuovaPasswordCliente" value="LrStudio2026!">
        <button class="action-btn btn-gold" onclick="creaNuovoAccountCliente()">⚡ Crea Account Cliente</button>
    </div>

    <!-- SEZIONE SCHEDA ALLENAMENTO -->
    <div class="admin-card">
        <h2>🏋️ Assegna Scheda Allenamento</h2>
        <label>Email Cliente</label>
        <input type="email" id="emailClienteScheda" placeholder="cliente@email.com">
        <label>Titolo Sessione (es. Giorno A - Petto e Bicipiti)</label>
        <input type="text" id="titoloSessione" placeholder="es. Giorno A - Petto e Bicipiti">
        <div id="eserciziContainer"></div>
        <button class="action-btn btn-outline" onclick="aggiungiBloccoEsercizio()">+ Aggiungi Esercizio</button>
        <button class="action-btn btn-gold" onclick="salvaSchedaCliente()">💾 Salva e Assegna Scheda</button>
    </div>

    <!-- SEZIONE PACCHETTO MASSAGGI -->
    <div class="admin-card">
        <h2>💆‍♂️ Pacchetto Massaggi</h2>
        <label>Email Cliente</label>
        <input type="email" id="emailClienteMassaggi" placeholder="cliente@email.com">
        <label>Nome Pacchetto</label>
        <input type="text" id="nomePacchetto" placeholder="es. Pacchetto Scarico / Decontratturante">
        <label>Sedute Rimanenti</label>
        <input type="number" id="seduteRimaste" placeholder="es. 3">
        <button class="action-btn btn-gold" onclick="salvaPacchettoMassaggi()">💾 Aggiorna Pacchetto</button>
    </div>

    <!-- SEZIONE MISURE ANTROPOMETRICHE -->
    <div class="admin-card">
        <h2>📏 Inserisci Misure Antropometriche</h2>
        <label>Email Cliente</label>
        <input type="email" id="emailClienteMisure" placeholder="cliente@email.com">
        <div class="grid-4">
            <div><label>Peso (kg)</label><input type="text" id="mPeso" placeholder="80"></div>
            <div><label>Petto (cm)</label><input type="text" id="mPetto" placeholder="105"></div>
            <div><label>Spalle (cm)</label><input type="text" id="mSpalle" placeholder="122"></div>
            <div><label>Braccio (cm)</label><input type="text" id="mBraccio" placeholder="38.5"></div>
            <div><label>Vita (cm)</label><input type="text" id="mVita" placeholder="80"></div>
            <div><label>Fianchi (cm)</label><input type="text" id="mFianchi" placeholder="95"></div>
            <div><label>Quadricipiti (cm)</label><input type="text" id="mQuadricipiti" placeholder="60"></div>
            <div><label>Polpacci (cm)</label><input type="text" id="mPolpacci" placeholder="38"></div>
        </div>
        <button class="action-btn btn-gold" onclick="salvaMisureAdmin()">💾 Salva Misurazioni</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://xhgxosffgsuokrsycvyd.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhoZ3hvc2ZmZ3N1b2tyc3ljdnlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMTgyNzgsImV4cCI6MjEwMzY5NDI3OH0.OGkhaS3O-aWXV65tV3uwMpo9VmCmr3Hgubfn2ShuVMg';
        const db = window.supabase.createClient(supabaseUrl, supabaseKey);

        const GITHUB_USER = "luigirosati31-design";
        const GITHUB_REPO = "app-lr-studio-pt";

        let opzioniGifPrecaricateHtml = `<option value="">-- Nessuna GIF (Mostra Logo LR) --</option>`;

        async function faiLogout() {
            await db.auth.signOut();
            window.location.href = "index.html";
        }

        async function creaNuovoAccountCliente() {
            const email = document.getElementById('nuovaEmailCliente').value.trim();
            const password = document.getElementById('nuovaPasswordCliente').value.trim();
            if (!email || !password) {
                alert("Inserisci email e password.");
                return;
            }
            const { data, error } = await db.auth.signUp({ email, password });
            if (error) {
                alert("Errore registrazione: " + error.message);
            } else {
                alert(`Account creato per ${email}! Ora puoi compilare la scheda sotto.`);
                document.getElementById('emailClienteScheda').value = email;
                document.getElementById('emailClienteMisure').value = email;
                document.getElementById('emailClienteMassaggi').value = email;
                document.getElementById('nuovaEmailCliente').value = '';
            }
        }

        async function caricaGifDaGitHub() {
            try {
                const resRoot = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/esercizi`);
                if (!resRoot.ok) return;
                const items = await resRoot.json();
                let gruppi = {};

                for (const item of items) {
                    if (item.type === 'dir') {
                        const nomeGruppo = item.name.toUpperCase();
                        const resSub = await fetch(item.url);
                        if (resSub.ok) {
                            const subFiles = await resSub.json();
                            const subGifs = subFiles.filter(f => f.name.match(/\.(gif|webp|png|jpg|jpeg)$/i));
                            if (!gruppi[nomeGruppo]) gruppi[nomeGruppo] = [];
                            subGifs.forEach(f => {
                                let nomeEx = f.name.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ").toUpperCase();
                                gruppi[nomeGruppo].push({ nome: nomeEx, percorso: `esercizi/${item.name}/${f.name}` });
                            });
                        }
                    } else if (item.type === 'file' && item.name.match(/\.(gif|webp|png|jpg|jpeg)$/i)) {
                        if (!gruppi["ALTRI"]) gruppi["ALTRI"] = [];
                        let nomeEx = item.name.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ").toUpperCase();
                        gruppi["ALTRI"].push({ nome: nomeEx, percorso: `esercizi/${item.name}` });
                    }
                }

                let html = `<option value="">-- Nessuna GIF (Mostra Logo LR) --</option>`;
                for (const [gruppo, lista] of Object.entries(gruppi)) {
                    html += `<optgroup label="${gruppo}">`;
                    lista.forEach(item => { html += `<option value="${item.percorso}">${item.nome}</option>`; });
                    html += `</optgroup>`;
                }

                opzioniGifPrecaricateHtml = html;
                document.querySelectorAll('.ex-gif').forEach(sel => {
                    let val = sel.value;
                    sel.innerHTML = opzioniGifPrecaricateHtml;
                    sel.value = val;
                });
            } catch (err) {
                console.error("Errore lettura cartella GitHub:", err);
            }
        }

        function aggiungiBloccoEsercizio() {
            const container = document.getElementById('eserciziContainer');
            const div = document.createElement('div');
            div.className = 'exercise-form-block';
            div.innerHTML = `
                <button type="button" class="remove-btn" onclick="this.parentElement.remove()">✕ Rimuovi</button>
                <label>Nome Esercizio</label>
                <input type="text" class="ex-nome" placeholder="es. Panca Piana Manubri">
                <label>Seleziona GIF / Animazione</label>
                <select class="ex-gif">${opzioniGifPrecaricateHtml}</select>
                <div class="grid-2">
                    <div>
                        <label>Target (es. 4x10)</label>
                        <input type="text" class="ex-target" placeholder="es. 4x10">
                    </div>
                    <div>
                        <label>Recupero (secondi)</label>
                        <input type="number" class="ex-recupero" placeholder="es. 90" value="90">
                    </div>
                </div>
            `;
            container.appendChild(div);
        }

        async function salvaSchedaCliente() {
            const email = document.getElementById('emailClienteScheda').value.trim();
            const titolo = document.getElementById('titoloSessione').value.trim();
            const blocchi = document.querySelectorAll('.exercise-form-block');

            if (!email || !titolo) {
                alert("Inserisci email cliente e titolo sessione.");
                return;
            }
            if (blocchi.length === 0) {
                alert("Aggiungi almeno un esercizio.");
                return;
            }

            const listaEsercizi = [];
            blocchi.forEach(b => {
                const nome = b.querySelector('.ex-nome').value.trim();
                const gif = b.querySelector('.ex-gif').value.trim();
                const target = b.querySelector('.ex-target').value.trim() || '3x10';
                const recupero = parseInt(b.querySelector('.ex-recupero').value) || 90;
                if (nome) {
                    listaEsercizi.push({ nome, gif, target, recupero });
                }
            });

            const { error } = await db.from('schede_clienti').insert([{
                email_cliente: email,
                titolo_sessione: titolo,
                dati_scheda: JSON.stringify(listaEsercizi)
            }]);

            if (error) {
                alert("Errore salvataggio: " + error.message);
            } else {
                alert(`Scheda "${titolo}" pubblicata per ${email}!`);
                document.getElementById('eserciziContainer').innerHTML = '';
                document.getElementById('titoloSessione').value = '';
                aggiungiBloccoEsercizio();
            }
        }

        async function salvaPacchettoMassaggi() {
            const email = document.getElementById('emailClienteMassaggi').value.trim();
            const nome = document.getElementById('nomePacchetto').value.trim();
            const sedute = parseInt(document.getElementById('seduteRimaste').value);

            if (!email || isNaN(sedute)) {
                alert("Inserisci email e numero sedute.");
                return;
            }

            const { error } = await db.from('pacchetti_massaggi').insert([{
                email_cliente: email,
                nome_pacchetto: nome || 'Pacchetto Massaggi Sportivi',
                sedute_rimaste: sedute
            }]);

            if (error) {
                alert("Errore massaggi: " + error.message);
            } else {
                alert("Pacchetto massaggi aggiornato!");
            }
        }

        async function salvaMisureAdmin() {
            const email = document.getElementById('emailClienteMisure').value.trim();
            if (!email) {
                alert("Inserisci email cliente.");
                return;
            }

            const peso = document.getElementById('mPeso').value;
            const petto = document.getElementById('mPetto').value;
            const spalle = document.getElementById('mSpalle').value;
            const braccio = document.getElementById('mBraccio').value;
            const vita = document.getElementById('mVita').value;
            const fianchi = document.getElementById('mFianchi').value;
            const quadricipiti = document.getElementById('mQuadricipiti').value;
            const polpacci = document.getElementById('mPolpacci').value;

            const { error } = await db.from('misure_clienti').insert([{
                email_cliente: email, peso, petto, spalle, braccio, vita, fianchi, quadricipiti, polpacci
            }]);

            if (error) {
                alert("Errore misure: " + error.message);
            } else {
                alert("Misure salvate con successo per " + email);
                ['mPeso','mPetto','mSpalle','mBraccio','mVita','mFianchi','mQuadricipiti','mPolpacci'].forEach(id => {
                    document.getElementById(id).value = '';
                });
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            aggiungiBloccoEsercizio();
            caricaGifDaGitHub();
        });
    </script>
</body>
</html>
