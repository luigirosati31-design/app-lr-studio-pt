<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Admin - LR Studio PT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #000000; 
            color: #ffffff; 
            font-family: 'Montserrat', sans-serif; 
            margin: 0; 
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        h2, h3 { 
            color: #d4af37; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .card {
            background-color: #111111;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #d4af37;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.1);
        }
        label {
            display: block;
            margin-top: 10px;
            font-size: 0.9rem;
            color: #ccc;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px 0;
            border-radius: 6px;
            border: 1px solid #333333;
            background: #0a0a0a;
            color: #ffffff;
            outline: none;
            font-family: 'Montserrat', sans-serif;
            box-sizing: border-box;
        }
        input:focus, select:focus, textarea:focus { border-color: #d4af37; }
        button {
            width: 100%;
            padding: 14px;
            background-color: #d4af37;
            color: #000000;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            margin-top: 10px;
        }
        button:hover { background-color: #b5952f; }
        .btn-logout {
            background-color: transparent;
            color: #ff4d4d;
            border: 1px solid #ff4d4d;
            width: auto;
            padding: 8px 15px;
            font-size: 0.8rem;
            margin-top: 0;
        }
        .btn-logout:hover {
            background-color: #ff4d4d;
            color: #fff;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid #222;
            text-align: left;
            font-size: 0.9rem;
        }
        th { color: #d4af37; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>Pannello Admin</h2>
            <button class="btn-logout" onclick="esci()">Esci</button>
        </div>

        <!-- SEZIONE CREAZIONE SCHEDA -->
        <div class="card">
            <h3>Assegna Nuova Scheda</h3>
            <label for="select-cliente">Seleziona Cliente</label>
            <select id="select-cliente">
                <option value="">Caricamento clienti...</option>
            </select>

            <label for="titolo-scheda">Nome Scheda (es. Scheda Forza A)</label>
            <input type="text" id="titolo-scheda" placeholder="Es. Full Body Ipertrofia">

            <label for="dettagli-allenamento">Dettagli Esercizi / Note</label>
            <textarea id="dettagli-allenamento" rows="6" placeholder="Es: 1. Panca Piana 4x8 90''&#10;2. Rematore 3x10 60''"></textarea>

            <button onclick="salvaScheda()">Salva e Assegna Scheda</button>
        </div>

        <!-- SEZIONE MONITORAGGIO MISURE UTENTI -->
        <div class="card">
            <h3>Ultime Misurazioni / Progressi Clienti</h3>
            <div style="overflow-x:auto;">
                <table id="tabella-misure">
                    <thead>
                        <tr>
                            <th>Cliente</th>
                            <th>Data</th>
                            <th>Peso (kg)</th>
                            <th>Note</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="4" style="text-align: center; color: #777;">Nessun dato registrato</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://xhgxosffgsuokrsycvyd.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhoZ3hvc2ZmZ3N1b2tyc3ljdnlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMTgyNzgsImV4cCI6MjEwMzY5NDI3OH0.OGkhaS3O-aWXV65tV3uwMpo9VmCmr3Hgubfn2ShuVMg';
        const db = window.supabase.createClient(supabaseUrl, supabaseKey);

        async function initAdmin() {
            const { data: { session } } = await db.auth.getSession();
            if (!session || session.user.email.toLowerCase() !== "luigirosati31@gmail.com") {
                window.location.href = "index.html";
                return;
            }
            caricaClienti();
            caricaMisure();
        }

        async function caricaClienti() {
            const select = document.getElementById('select-cliente');
            const { data, error } = await db.from('profili_clienti').select('*');
            
            if (error) {
                console.error("Errore caricamento clienti:", error);
                select.innerHTML = '<option value="">Errore caricamento clienti</option>';
                return;
            }

            select.innerHTML = '<option value="">Seleziona un cliente...</option>';
            if (data && data.length > 0) {
                data.forEach(cliente => {
                    let opt = document.createElement('option');
                    opt.value = cliente.id || cliente.email;
                    opt.textContent = cliente.nome || cliente.email;
                    select.appendChild(opt);
                });
            } else {
                select.innerHTML = '<option value="">Nessun cliente trovato</option>';
            }
        }

        async function salvaScheda() {
            const clienteId = document.getElementById('select-cliente').value;
            const titolo = document.getElementById('titolo-scheda').value;
            const dettagli = document.getElementById('dettagli-allenamento').value;

            if (!clienteId || !titolo || !dettagli) {
                alert("Compila tutti i campi prima di salvare.");
                return;
            }

            const { error } = await db.from('schede_clienti').insert([
                { cliente_id: clienteId, titolo: titolo, dettagli: dettagli, data_creazione: new Date() }
            ]);

            if (error) {
                alert("Errore durante il salvataggio della scheda: " + error.message);
            } else {
                alert("Scheda assegnata con successo al cliente!");
                document.getElementById('titolo-scheda').value = '';
                document.getElementById('dettagli-allenamento').value = '';
            }
        }

        async function caricaMisure() {
            const tbody = document.querySelector('#tabella-misure tbody');
            const { data, error } = await db.from('misure_clienti').select('*').order('created_at', { ascending: false }).limit(5);

            if (!error && data && data.length > 0) {
                tbody.innerHTML = '';
                data.forEach(m => {
                    let tr = document.createElement('tr');
                    tr.innerHTML = `<td>${m.cliente_email || 'Cliente'}</td><td>${new Date(m.created_at).toLocaleDateString()}</td><td>${m.peso || '-'} kg</td><td>${m.note || '-'}</td>`;
                    tbody.appendChild(tr);
                });
            }
        }

        function esci() {
            db.auth.signOut().then(() => {
                window.location.href = "index.html";
            });
        }

        initAdmin();
    </script>
</body>
</html>
