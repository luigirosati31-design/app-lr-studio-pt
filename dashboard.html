<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Area Cliente - LR Studio PT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #000000; 
            color: #ffffff; 
            font-family: 'Montserrat', sans-serif; 
            margin: 0; 
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        h2, h3 { 
            color: #d4af37; 
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 0;
        }
        .card {
            background-color: #111111;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #d4af37;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.1);
        }
        label {
            display: block;
            margin-top: 10px;
            font-size: 0.9rem;
            color: #ccc;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px 0;
            border-radius: 6px;
            border: 1px solid #333333;
            background: #0a0a0a;
            color: #ffffff;
            outline: none;
            font-family: 'Montserrat', sans-serif;
            box-sizing: border-box;
        }
        input:focus, textarea:focus { border-color: #d4af37; }
        button {
            width: 100%;
            padding: 14px;
            background-color: #d4af37;
            color: #000000;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            margin-top: 10px;
        }
        button:hover { background-color: #b5952f; }
        .btn-logout {
            background-color: transparent;
            color: #ff4d4d;
            border: 1px solid #ff4d4d;
            width: auto;
            padding: 8px 15px;
            font-size: 0.8rem;
            margin-top: 0;
        }
        .btn-logout:hover {
            background-color: #ff4d4d;
            color: #fff;
        }
        .scheda-box {
            background: #0a0a0a;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #333;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 0.95rem;
            color: #ddd;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>Dashboard Cliente</h2>
            <button class="btn-logout" onclick="esci()">Esci</button>
        </div>

        <!-- SEZIONE SCHEDA ATTIVA -->
        <div class="card">
            <h3 id="titolo-scheda-corrente">La Tua Scheda</h3>
            <div id="contenuto-scheda" class="scheda-box">
                Caricamento scheda in corso...
            </div>
        </div>

        <!-- SEZIONE AGGIORNAMENTO MISURE / CARICHI -->
        <div class="card">
            <h3>Registra i tuoi Progressi</h3>
            <label for="peso-utente">Peso Attuale (kg)</label>
            <input type="number" step="0.1" id="peso-utente" placeholder="Es. 75.5">

            <label for="note-utente">Note / Sensazioni sull'allenamento</label>
            <textarea id="note-utente" rows="3" placeholder="Es. Ottime sensazioni sulla panca, aumentato il carico."></textarea>

            <button onclick="salvaMisure()">Invia al Coach</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://xhgxosffgsuokrsycvyd.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhoZ3hvc2ZmZ3N1b2tyc3ljdnlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMTgyNzgsImV4cCI6MjEwMzY5NDI3OH0.OGkhaS3O-aWXV65tV3uwMpo9VmCmr3Hgubfn2ShuVMg';
        const db = window.supabase.createClient(supabaseUrl, supabaseKey);

        let utenteCorrente = null;

        async function initDashboard() {
            const { data: { session } } = await db.auth.getSession();
            if (!session) {
                window.location.href = "index.html";
                return;
            }
            utenteCorrente = session.user;
            caricaSchedaCliente(utenteCorrente.id, utenteCorrente.email);
        }

        async function caricaSchedaCliente(userId, userEmail) {
            const boxScheda = document.getElementById('contenuto-scheda');
            const titoloScheda = document.getElementById('titolo-scheda-corrente');

            const { data, error } = await db.from('schede_clienti')
                .select('*')
                .or(`cliente_id.eq.${userId},cliente_id.eq.${userEmail}`)
                .order('data_creazione', { ascending: false })
                .limit(1);

            if (error) {
                console.error("Errore caricamento scheda:", error);
                boxScheda.textContent = "Errore nel caricamento della scheda.";
                return;
            }

            if (data && data.length > 0) {
                titoloScheda.textContent = data[0].titolo || "La Tua Scheda";
                boxScheda.textContent = data[0].dettagli;
            } else {
                boxScheda.textContent = "Nessuna scheda assegnata al momento. Il coach la caricherà presto!";
            }
        }

        async function salvaMisure() {
            const peso = document.getElementById('peso-utente').value;
            const note = document.getElementById('note-utente').value;

            if (!peso && !note) {
                alert("Inserisci almeno il peso o una nota.");
                return;
            }

            const { error } = await db.from('misure_clienti').insert([
                { 
                    cliente_id: utenteCorrente.id, 
                    cliente_email: utenteCorrente.email,
                    peso: peso ? parseFloat(peso) : null, 
                    note: note,
                    created_at: new Date() 
                }
            ]);

            if (error) {
                alert("Errore durante l'invio dei dati: " + error.message);
            } else {
                alert("Dati inviati con successo al tuo coach!");
                document.getElementById('peso-utente').value = '';
                document.getElementById('note-utente').value = '';
            }
        }

        function esci() {
            db.auth.signOut().then(() => {
                window.location.href = "index.html";
            });
        }

        initDashboard();
    </script>
</body>
</html>
