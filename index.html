<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LR Studio PT - Accesso Atleta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --bg-color: #08090b;
            --card-bg: rgba(18, 20, 25, 0.88);
            --card-border: rgba(212, 175, 55, 0.22);
            --gold-main: #d4af37;
            --gold-gradient: linear-gradient(135deg, #f5e29f 0%, #d4af37 50%, #9e7b17 100%);
            --gold-glow: 0 0 24px rgba(212, 175, 55, 0.28);
            --input-bg: #111317;
            --input-border: #242730;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 15%, rgba(212, 175, 55, 0.09) 0%, transparent 60%),
                radial-gradient(circle at 50% 100%, rgba(20, 22, 28, 0.8) 0%, transparent 100%);
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 94vh;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* --- SPLASH SCREEN INTRO --- */
        #splashScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #08090b;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #splashScreen.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: splashEntrance 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .splash-media-frame {
            width: 86px;
            height: 86px;
            border-radius: 22px;
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.45);
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 18px;
            position: relative;
        }
        .splash-monogram {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .splash-title {
            font-size: 1.35rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin: 0;
            color: #ffffff;
        }
        .splash-title span {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .splash-sub {
            font-size: 0.72rem;
            color: #8c929e;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 6px;
            font-weight: 600;
        }

        .splash-loader-bar {
            width: 130px;
            height: 2px;
            background: #1c1e26;
            margin-top: 22px;
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }
        .splash-loader-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: -50%;
            width: 50%;
            height: 100%;
            background: var(--gold-gradient);
            box-shadow: var(--gold-glow);
            animation: loadBar 1.5s infinite ease-in-out;
        }

        @keyframes splashEntrance {
            0% { transform: scale(0.85); opacity: 0; filter: blur(6px); }
            100% { transform: scale(1); opacity: 1; filter: blur(0); }
        }
        @keyframes loadBar {
            0% { left: -50%; width: 30%; }
            50% { width: 60%; }
            100% { left: 100%; width: 30%; }
        }

        /* --- LOGIN CARD --- */
        .login-card {
            width: 100%;
            max-width: 380px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 36px 26px;
            box-sizing: border-box;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.8), 0 0 30px rgba(212, 175, 55, 0.05);
            text-align: center;
            position: relative;
            overflow: hidden;
            animation: cardAppear 0.8s ease backwards;
            animation-delay: 0.15s;
        }

        @keyframes cardAppear {
            0% { opacity: 0; transform: translateY(14px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 15%;
            right: 15%;
            height: 2px;
            background: var(--gold-gradient);
            box-shadow: var(--gold-glow);
        }

        .logo-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.35);
            margin-bottom: 12px;
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--gold-main);
            letter-spacing: 1px;
        }

        h1 {
            color: #ffffff;
            font-size: 1.35rem;
            margin: 0 0 4px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
        }
        h1 span {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #7b808a;
            font-size: 0.76rem;
            margin: 0 0 24px 0;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .form-group { margin-bottom: 16px; text-align: left; }

        label {
            display: block;
            font-size: 0.68rem;
            color: #8c929e;
            text-transform: uppercase;
            margin-bottom: 7px;
            letter-spacing: 1px;
            font-weight: 600;
        }

        input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: #ffffff;
            padding: 13px 14px;
            border-radius: 10px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.88rem;
            box-sizing: border-box;
            transition: all 0.25s ease;
        }

        input:focus {
            border-color: var(--gold-main);
            outline: none;
            box-shadow: 0 0 14px rgba(212, 175, 55, 0.22);
            background: #16181f;
        }

        .pin-input {
            font-size: 1.4rem;
            letter-spacing: 10px;
            text-align: center;
            font-weight: 700;
            color: var(--gold-main);
        }

        .btn-gold {
            width: 100%;
            background: var(--gold-gradient);
            color: #08090b;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 1.5px;
            margin-top: 10px;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.25);
            transition: all 0.25s ease;
        }

        .btn-gold:hover {
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
            transform: translateY(-1px);
        }
        .btn-gold:active { transform: translateY(1px); }
        .btn-gold:disabled { opacity: 0.5; cursor: not-allowed; }

        .divider {
            margin: 24px 0 14px 0;
            border-top: 1px solid #1f2228;
        }

        .admin-link {
            color: #555c68;
            font-size: 0.72rem;
            text-decoration: none;
            cursor: pointer;
            display: inline-block;
            transition: color 0.2s ease;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .admin-link:hover { color: var(--gold-main); }

        .error-msg {
            display: none;
            background: rgba(231, 76, 60, 0.12);
            border: 1px solid rgba(231, 76, 60, 0.5);
            color: #ff7675;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            margin-bottom: 16px;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- INTRO SPLASH SCREEN -->
    <div id="splashScreen">
        <div class="splash-logo-container">
            <div class="splash-media-frame">
                <span class="splash-monogram">LR</span>
            </div>
            <div class="splash-title">LR <span>Studio PT</span></div>
            <div class="splash-sub">Personal Training & Massaggi</div>
            <div class="splash-loader-bar"></div>
        </div>
    </div>

    <!-- SCHEDA ACCESSO ATLETA -->
    <div class="login-card">
        <div class="logo-badge">LR</div>
        <h1>LR <span>Studio PT</span></h1>
        <p>Area Riservata Atleti</p>

        <div id="erroreBox" class="error-msg"></div>

        <div class="form-group">
            <label for="nomeInput">Nome e Cognome</label>
            <input type="text" id="nomeInput" placeholder="es. Mario Rossi" autocomplete="name" spellcheck="false">
        </div>

        <div class="form-group">
            <label for="pinInput">PIN di Sicurezza (4 cifre)</label>
            <input type="password" id="pinInput" class="pin-input" maxlength="4" placeholder="••••" inputmode="numeric">
        </div>

        <button class="btn-gold" id="btnAccedi" onclick="validaAccessoCliente()">Entra nella Scheda</button>

        <div class="divider"></div>

        <a class="admin-link" onclick="mostraLoginAdmin()">Area Riservata Coach</a>

        <div id="boxAccessoAdmin" style="display: none; margin-top: 16px;">
            <div class="form-group">
                <label>PIN Master Coach</label>
                <input type="password" id="adminPin" class="pin-input" placeholder="••••" style="letter-spacing: normal; font-size: 0.95rem;">
            </div>
            <button class="btn-gold" style="background: #171920; color: #d4af37; border: 1px solid #d4af37; box-shadow: none;" onclick="entraComeAdmin()">Accedi Pannello Coach</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://xhgxosffgsuokrsycvyd.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhoZ3hvc2ZmZ3N1b2tyc3ljdnlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMTgyNzgsImV4cCI6MjEwMzY5NDI3OH0.OGkhaS3O-aWXV65tV3uwMpo9VmCmr3Hgubfn2ShuVMg';
        const db = window.supabase.createClient(supabaseUrl, supabaseKey);

        window.addEventListener("load", () => {
            setTimeout(() => {
                const splash = document.getElementById("splashScreen");
                if (splash) splash.classList.add("fade-out");
            }, 1200);
        });

        document.addEventListener("DOMContentLoaded", () => {
            const tokenSalvato = localStorage.getItem('studio_pt_client_id');
            const pinSalvato = localStorage.getItem('studio_pt_client_pin');
            if (tokenSalvato && pinSalvato) {
                window.location.href = `dashboard.html?id=${tokenSalvato}`;
            }
        });

        function mostraErrore(testo) {
            const box = document.getElementById('erroreBox');
            box.innerText = testo;
            box.style.display = 'block';
        }

        async function validaAccessoCliente() {
            const nomeRaw = document.getElementById('nomeInput').value.trim();
            const pinRaw = document.getElementById('pinInput').value.trim();
            const btn = document.getElementById('btnAccedi');

            if (!nomeRaw || !pinRaw) {
                mostraErrore("Compila sia il Nome che il PIN.");
                return;
            }

            const slugTrattino = nomeRaw.toLowerCase().replace(/\s+/g, '-').replace(/[^\w-]/g, '');
            const slugPiatto = nomeRaw.toLowerCase().replace(/\s+/g, '').replace(/[^\w-]/g, '');

            btn.disabled = true;
            btn.innerText = "Verifica...";

            try {
                const { data, error } = await db
                    .from('schede_clienti')
                    .select('client_id, pin')
                    .or(`client_id.eq.${slugTrattino},email_cliente.eq.${slugTrattino},client_id.eq.${slugPiatto},email_cliente.eq.${slugPiatto}`);

                if (error || !data || data.length === 0) {
                    mostraErrore("Atleta non trovato. Contatta il Coach.");
                    return;
                }

                const pinReg = (data[0].pin || "").toString().trim();
                if (pinReg !== "" && pinReg !== pinRaw) {
                    mostraErrore("PIN errato.");
                    return;
                }

                const idEffettivo = data[0].client_id || slugTrattino;
                localStorage.setItem('studio_pt_client_id', idEffettivo);
                localStorage.setItem('studio_pt_client_pin', pinRaw);
                window.location.href = `dashboard.html?id=${idEffettivo}`;
            } catch (err) {
                mostraErrore("Errore: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Entra nella Scheda";
            }
        }

        function mostraLoginAdmin() {
            const box = document.getElementById('boxAccessoAdmin');
            box.style.display = (box.style.display === 'none') ? 'block' : 'none';
        }

        function entraComeAdmin() {
            const pin = document.getElementById('adminPin').value.trim();
            if (pin === "studio2026" || pin === "1234") {
                localStorage.setItem('studio_pt_admin_logged', 'true');
                window.location.href = "admin.html";
            } else {
                alert("PIN non corretto.");
            }
        }
    </script>
</body>
</html>
