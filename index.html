<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Studio PT - Accesso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        .login-card {
            width: 100%;
            max-width: 380px;
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 35px 25px;
            box-sizing: border-box;
            box-shadow: 0 8px 30px rgba(0,0,0,0.8);
            text-align: center;
        }
        h1 {
            color: #d4af37;
            font-size: 1.4rem;
            margin: 0 0 8px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }
        p {
            color: #888;
            font-size: 0.8rem;
            margin: 0 0 25px 0;
        }
        .info-box {
            background: #161616;
            border: 1px solid #262626;
            border-radius: 8px;
            padding: 15px;
            font-size: 0.8rem;
            color: #ccc;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 0.7rem;
            color: #aaa;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 1px;
            font-weight: 600;
        }
        input {
            width: 100%;
            background: #181818;
            border: 1px solid #333;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            box-sizing: border-box;
        }
        input:focus { border-color: #d4af37; outline: none; }
        .btn-gold {
            width: 100%;
            background: #d4af37;
            color: #000;
            border: none;
            padding: 13px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 1px;
        }
        .admin-toggle {
            color: #555;
            font-size: 0.72rem;
            text-decoration: none;
            cursor: pointer;
            margin-top: 25px;
            display: inline-block;
        }
        .admin-toggle:hover { color: #d4af37; }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>Studio PT</h1>
        <p>Area Riservata Clienti</p>

        <div class="info-box">
            📲 <b>Sei un atleta seguito?</b><br>
            Accedi direttamente dal link personale che ti ha inviato il Coach su WhatsApp.
        </div>

        <a class="admin-toggle" onclick="mostraLoginAdmin()">Area Riservata Coach</a>

        <div id="boxAccessoAdmin" style="display: none; margin-top: 15px;">
            <div class="form-group">
                <label>PIN Coach</label>
                <input type="password" id="adminPin" placeholder="Inserisci PIN">
            </div>
            <button class="btn-gold" style="background:#222; color:#d4af37; border:1px solid #d4af37;" onclick="entraComeAdmin()">Entra come Coach</button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const tokenSalvato = localStorage.getItem('studio_pt_client_id');
            if (tokenSalvato) {
                window.location.href = `dashboard.html?id=${tokenSalvato}`;
            }
        });

        function mostraLoginAdmin() {
            const box = document.getElementById('boxAccessoAdmin');
            box.style.display = (box.style.display === 'none') ? 'block' : 'none';
        }

        function entraComeAdmin() {
            const pin = document.getElementById('adminPin').value.trim();
            if (pin === "studio2026" || pin === "1234") {
                window.location.href = "admin.html";
            } else {
                alert("PIN Coach non corretto.");
            }
        }
    </script>
</body>
</html>
