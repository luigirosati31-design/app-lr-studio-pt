<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LR Studio PT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #000000; 
            color: #ffffff; 
            font-family: 'Montserrat', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        .header-logo {
            max-width: 140px; 
            height: auto;
            margin-bottom: 30px; 
            filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.4));
        }
        .login-box { 
            background-color: #111111; 
            padding: 30px 25px; 
            border-radius: 12px; 
            width: 100%; 
            max-width: 320px; 
            text-align: center; 
            border: 1px solid #d4af37; 
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.15); 
            box-sizing: border-box;
        }
        h2 { 
            color: #d4af37; 
            margin-bottom: 25px; 
            margin-top: 0;
            font-weight: 700; 
            letter-spacing: 2px; 
            text-transform: uppercase;
            font-size: 1.1rem;
        }
        input { 
            width: 100%; 
            padding: 14px; 
            margin: 10px 0; 
            border-radius: 6px; 
            border: 1px solid #333333; 
            background: #0a0a0a; 
            color: #ffffff; 
            outline: none; 
            font-family: 'Montserrat', sans-serif;
            box-sizing: border-box;
        }
        input:focus { border-color: #d4af37; }
        button { 
            width: 100%; 
            padding: 14px; 
            background-color: #d4af37; 
            color: #000000; 
            border: none; 
            border-radius: 6px; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            cursor: pointer; 
            margin-top: 20px; 
            font-family: 'Montserrat', sans-serif;
            box-sizing: border-box;
        }
        button:hover { background-color: #b5952f; }
    </style>
</head>
<body>
    <img src="logo-grande.png" alt="Icona LR" class="header-logo">

    <div class="login-box">
        <h2>LR Studio PT</h2>
        <input type="email" placeholder="Email" id="email">
        <input type="password" placeholder="Password" id="password">
        <button onclick="faiLogin()">Accedi</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://xhgxosffgsuokrsycvyd.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhoZ3hvc2ZmZ3N1b2tyc3ljdnlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMTgyNzgsImV4cCI6MjEwMzY5NDI3OH0.OGkhaS3O-aWXV65tV3uwMpo9VmCmr3Hgubfn2ShuVMg';
        const db = window.supabase.createClient(supabaseUrl, supabaseKey);

        async function faiLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if(!email || !password) {
                alert("Inserisci email e password.");
                return;
            }
            
            const { data, error } = await db.auth.signInWithPassword({ email, password });

            if (error) {
                alert("Credenziali non valide.");
            } else {
                if(email.includes("admin")) {
                    window.location.href = "admin.html";
                } else {
                    window.location.href = "dashboard.html";
                }
            }
        }
    </script>
</body>
</html>
