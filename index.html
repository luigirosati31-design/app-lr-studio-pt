<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Studio PT - Accesso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        .login-card {
            width: 100%;
            max-width: 380px;
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 30px 22px;
            box-sizing: border-box;
            box-shadow: 0 8px 30px rgba(0,0,0,0.8);
            text-align: center;
        }
        h1 {
            color: #d4af37;
            font-size: 1.4rem;
            margin: 0 0 8px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }
        p {
            color: #888;
            font-size: 0.8rem;
            margin: 0 0 25px 0;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 0.7rem;
            color: #aaa;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 1px;
            font-weight: 600;
        }
        input {
            width: 100%;
            background: #181818;
            border: 1px solid #333;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            box-sizing: border-box;
        }
        input:focus {
            border-color: #d4af37;
            outline: none;
        }
        .btn-gold {
            width: 100%;
            background: #d4af37;
            color: #000;
            border: none;
            padding: 13px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 1px;
            margin-top: 10px;
        }
        .divider {
            margin: 25px 0 15px 0;
            border-top: 1px solid #222;
        }
        .admin-link {
            color: #666;
            font-size: 0.75rem;
            text-decoration: none;
            cursor: pointer;
        }
        .admin-link:hover { color: #d4af37; }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>Studio PT</h1>
        <p>Allenamento & Massaggio Sportivo</p>

        <div id="boxAccessoCliente">
            <div class="form-group">
                <label>Nome e Cognome Cliente</label>
                <input type="text" id="nomeClienteInput" placeholder="es. Enrico Lombardi">
            </div>
            <button class="btn-gold" onclick="entraComeCliente()">Accedi alla Scheda</button>
        </div>

        <div class="divider"></div>
        <a class="admin-link" onclick="mostraLoginAdmin()">Area Riservata Coach</a>

        <div id="boxAccessoAdmin" style="display: none; margin-top: 15px;">
            <div class="form-group">
                <label>Codice Sicurezza Coach</label>
                <input type="password" id="adminPin" placeholder="PIN di accesso">
            </div>
            <button class="btn-gold" style="background:#222; color:#d4af37; border:1px solid #d4af37;" onclick="entraComeAdmin()">Accedi Pannello</button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const salvato = localStorage.getItem('studio_pt_client_id');
            if (salvato) {
                window.location.href = `dashboard.html?id=${salvato}`;
            }
        });

        function entraComeCliente() {
            const raw = document.getElementById('nomeClienteInput').value.trim();
            if (!raw) {
                alert("Inserisci il tuo Nome e Cognome.");
                return;
            }
            const slug = raw.toLowerCase().replace(/[^\w\s-]/g, '').replace(/\s+/g, '-');
            localStorage.setItem('studio_pt_client_id', slug);
            window.location.href = `dashboard.html?id=${slug}`;
        }

        function mostraLoginAdmin() {
            const box = document.getElementById('boxAccessoAdmin');
            box.style.display = (box.style.display === 'none') ? 'block' : 'none';
        }

        function entraComeAdmin() {
            const pin = document.getElementById('adminPin').value.trim();
            if (pin === "studio2026" || pin === "1234") {
                localStorage.setItem('studio_pt_admin_logged', 'true');
                window.location.href = "admin.html";
            } else {
                alert("Codice Coach non valido.");
            }
        }
    </script>
</body>
</html>
